<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | LUXURY TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --gold: #D4AF37; --dark: #050505; --glass: rgba(10, 10, 10, 0.98); }
        body { 
            font-family: 'Rajdhani', sans-serif; background: var(--dark); color: #eee; margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 80%);
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass-panel { background: var(--glass); border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 0 50px rgba(0,0,0,1); }
        .btn-gold { 
            background: linear-gradient(135deg, #b38728 0%, #fcf6ba 50%, #bf953f 100%); 
            color: #000; font-weight: 800; border: none; cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }

        /* ANIMASI CENTANG MEWAH */
        .check-container { width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
        .check-circle { 
            width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            animation: pulse-gold 2s infinite; 
        }
        @keyframes pulse-gold { 
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 30px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }
        
        .hidden { display: none !important; }
        .status-badge { padding: 2px 8px; font-size: 9px; font-weight: bold; text-transform: uppercase; border-radius: 2px; }
        .bg-proses { background: #f39c12; color: #000; }
        .bg-kirim { background: #2ecc71; color: #000; }
        .bg-gagal { background: #e74c3c; color: #fff; }
    </style>
</head>
<body>

    <nav id="navbar" class="hidden fixed top-0 w-full z-50 glass-panel border-b border-gold/20 px-6 py-4 flex justify-between items-center">
        <h1 class="font-luxury text-gold text-xl font-bold">RHF</h1>
        <div class="flex items-center gap-6">
            <button onclick="changePage('shop')" class="text-[10px] text-white uppercase">Market</button>
            <button onclick="changePage('orders')" class="text-[10px] text-white uppercase">Pesanan Saya</button>
            <button id="god-btn" onclick="changePage('admin')" class="hidden text-[10px] text-red-500 border border-red-500 px-2 py-1 font-bold animate-pulse">GOD MODE</button>
            <button onclick="logout()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <section id="auth-page" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass-panel w-full max-w-sm p-8 text-center">
            <h1 class="font-luxury text-gold text-2xl mb-6">LOGIN REQUIRED</h1>
            <input type="email" id="email" placeholder="Email" class="w-full p-3 bg-black border border-zinc-800 text-xs mb-3">
            <input type="password" id="pass" placeholder="Password" class="w-full p-3 bg-black border border-zinc-800 text-xs mb-4">
            <button onclick="handleLogin()" class="btn-gold w-full py-3 text-xs mb-2">LOGIN</button>
            <button onclick="handleReg()" class="text-[10px] text-zinc-500 underline">Register</button>
        </div>
    </section>

    <div id="main-app" class="hidden">
        
        <section id="page-shop" class="pt-28 px-6 pb-20 max-w-6xl mx-auto">
            <div id="shop-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <div id="invoice-modal" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-6 backdrop-blur-md">
            <div class="glass-panel w-full max-w-md p-8 relative">
                <button onclick="closeInvoice()" class="absolute top-4 right-4 text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                <h3 class="font-luxury text-gold text-center text-xl mb-6 border-b border-gold/20 pb-4">RINCIAN PESANAN</h3>
                
                <div class="space-y-4 text-xs">
                    <div class="flex justify-between">
                        <span class="text-zinc-500">NO. PESANAN:</span>
                        <span id="inv-id" class="text-white font-bold font-mono">#...</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-zinc-500">PRODUK:</span>
                        <span id="inv-name" class="text-white">...</span>
                    </div>
                    <div class="flex justify-between border-t border-white/5 pt-4">
                        <span class="text-zinc-500">TOTAL TAGIHAN:</span>
                        <span id="inv-price" class="text-gold font-bold text-lg">Rp 0</span>
                    </div>
                </div>

                <div class="mt-8 p-4 bg-white/5 rounded border border-white/10 italic text-[10px] text-center text-zinc-400">
                    Selesaikan pembayaran ke nomor dompet admin sebelum menekan tombol konfirmasi.
                </div>

                <button onclick="showAnimation()" class="btn-gold w-full py-4 text-xs font-bold mt-6 tracking-widest">CONFIRM PAYMENT</button>
            </div>
        </div>

        <div id="anim-overlay" class="hidden fixed inset-0 bg-black z-[200] flex flex-col items-center justify-center">
            <div class="check-container">
                <div class="check-circle">
                    <i class="fa-solid fa-check text-4xl text-gold"></i>
                </div>
            </div>
            <p class="font-luxury text-gold mt-6 tracking-widest animate-pulse">PROCESSING IDENTITY...</p>
        </div>

        <section id="page-detail" class="hidden pt-28 px-6 pb-20 max-w-lg mx-auto">
            <div class="glass-panel p-8">
                <div class="text-center mb-8">
                    <i class="fa-solid fa-circle-check text-5xl text-green-500 mb-4"></i>
                    <h2 class="font-luxury text-2xl text-white uppercase">Payment Submitted</h2>
                </div>
                <div id="detail-content" class="space-y-4 text-xs border-y border-white/5 py-6">
                    </div>
                <button onclick="changePage('orders')" class="btn-gold w-full py-3 text-xs mt-8">LIHAT PESANAN SAYA</button>
            </div>
        </section>

        <section id="page-orders" class="hidden pt-28 px-6 pb-20 max-w-2xl mx-auto">
            <h2 class="font-luxury text-white text-xl mb-6 tracking-widest">HISTORY VAULT</h2>
            <div id="order-list" class="space-y-4"></div>
        </section>

        <section id="page-admin" class="hidden pt-28 px-6 pb-20">
             <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-panel p-4">
                    <h3 class="text-gold text-xs mb-4 uppercase">Manage Products</h3>
                    <input type="text" id="p-name" placeholder="Nama Produk" class="w-full p-2 bg-black border border-zinc-800 text-[10px] mb-2">
                    <input type="number" id="p-price" placeholder="Harga" class="w-full p-2 bg-black border border-zinc-800 text-[10px] mb-2">
                    <input type="text" id="p-img" placeholder="Direct Image URL (PENTING!)" class="w-full p-2 bg-black border border-zinc-800 text-[10px] mb-2">
                    <button onclick="adminAddP()" class="btn-gold w-full py-2 text-xs">TAMBAH PRODUK</button>
                </div>
                <div class="glass-panel p-4">
                    <h3 class="text-gold text-xs mb-4 uppercase">Manage Orders Status</h3>
                    <div id="adm-orders" class="space-y-2 h-96 overflow-y-auto"></div>
                </div>
             </div>
        </section>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const BOSS_EMAIL = "gacoruncek73@gmail.com";
        const firebaseConfig = {
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentOrderData = null;

        // -- EXPOSE TO WINDOW --
        window.handleLogin = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("Gagal Login"));
        };

        window.handleReg = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            createUserWithEmailAndPassword(auth, e, p).then(u => {
                set(ref(db, 'users/' + u.user.uid), { email: e, balance: 0 });
            });
        };

        window.logout = () => signOut(auth);

        window.changePage = (p) => {
            ['shop', 'detail', 'orders', 'admin'].forEach(id => {
                const el = document.getElementById('page-'+id);
                if(el) el.classList.add('hidden');
            });
            document.getElementById('page-'+p).classList.remove('hidden');
        };

        // --- MARKET LOGIC ---
        function syncMarket() {
            onValue(ref(db, 'products'), (s) => {
                const grid = document.getElementById('shop-grid');
                grid.innerHTML = "";
                s.forEach(c => {
                    const p = c.val();
                    // Tips Gambar: Pastikan URL berakhir dengan .jpg, .png atau link direct
                    grid.innerHTML += `
                        <div class="glass-panel p-4 group">
                            <div class="h-40 overflow-hidden bg-black mb-4">
                                <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'" class="w-full h-full object-cover">
                            </div>
                            <h4 class="text-xs text-zinc-400 mb-1">${p.name}</h4>
                            <p class="text-gold font-bold mb-4">Rp ${p.price.toLocaleString()}</p>
                            <button onclick="openInvoice('${c.key}', '${p.name}', ${p.price})" class="btn-gold w-full py-2 text-[10px]">ACQUIRE</button>
                        </div>`;
                });
            });
        }

        window.openInvoice = (id, name, price) => {
            currentOrderData = { id, name, price };
            document.getElementById('inv-id').innerText = "#" + Math.random().toString(36).substr(2, 9).toUpperCase();
            document.getElementById('inv-name').innerText = name;
            document.getElementById('inv-price').innerText = "Rp " + price.toLocaleString();
            document.getElementById('invoice-modal').classList.remove('hidden');
        };

        window.closeInvoice = () => document.getElementById('invoice-modal').classList.add('hidden');

        window.showAnimation = () => {
            document.getElementById('invoice-modal').classList.add('hidden');
            document.getElementById('anim-overlay').classList.remove('hidden');
            
            // Simpan ke DB
            const orderRef = push(ref(db, 'orders'));
            const orderData = {
                uid: auth.currentUser.uid,
                email: auth.currentUser.email,
                product: currentOrderData.name,
                price: currentOrderData.price,
                orderId: document.getElementById('inv-id').innerText,
                status: 'proses', // Default: Proses
                date: new Date().toLocaleString()
            };

            set(orderRef, orderData).then(() => {
                setTimeout(() => {
                    document.getElementById('anim-overlay').classList.add('hidden');
                    showDetailPage(orderData);
                }, 3000); // 3 detik animasi mewah
            });
        };

        function showDetailPage(data) {
            const content = document.getElementById('detail-content');
            content.innerHTML = `
                <div class="flex justify-between"><span>ID Pesanan</span><span class="text-white">${data.orderId}</span></div>
                <div class="flex justify-between"><span>Status</span><span class="status-badge bg-proses">Dalam Proses</span></div>
                <div class="flex justify-between"><span>Produk</span><span class="text-white">${data.product}</span></div>
                <div class="flex justify-between"><span>Waktu</span><span class="text-white">${data.date}</span></div>
            `;
            changePage('detail');
        }

        function syncOrders() {
            onValue(ref(db, 'orders'), (s) => {
                const list = document.getElementById('order-list');
                const admList = document.getElementById('adm-orders');
                list.innerHTML = "";
                if(admList) admList.innerHTML = "";

                s.forEach(c => {
                    const o = c.val();
                    const k = c.key;
                    
                    // Dashboard User
                    if(o.uid === auth.currentUser.uid) {
                        list.innerHTML += `
                            <div class="glass-panel p-4 flex justify-between items-center">
                                <div>
                                    <p class="text-[10px] text-zinc-500">${o.orderId}</p>
                                    <h4 class="text-xs text-white font-bold">${o.product}</h4>
                                </div>
                                <span class="status-badge bg-${o.status}">${o.status}</span>
                            </div>`;
                    }

                    // Dashboard Admin
                    if(auth.currentUser.email === BOSS_EMAIL && admList) {
                        admList.innerHTML += `
                            <div class="bg-white/5 p-3 text-[10px] border border-white/10 mb-2">
                                <p>${o.email} - ${o.product}</p>
                                <div class="flex gap-2 mt-2">
                                    <button onclick="updateStatus('${k}', 'proses')" class="bg-proses px-2 py-1 text-black">PROSES</button>
                                    <button onclick="updateStatus('${k}', 'kirim')" class="bg-kirim px-2 py-1 text-black">KIRIM</button>
                                    <button onclick="updateStatus('${k}', 'gagal')" class="bg-gagal px-2 py-1 text-white">GAGAL</button>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        window.updateStatus = (key, status) => update(ref(db, 'orders/' + key), { status });

        window.adminAddP = () => {
            const name = document.getElementById('p-name').value;
            const price = parseInt(document.getElementById('p-price').value);
            const img = document.getElementById('p-img').value;
            if(name && price) push(ref(db, 'products'), { name, price, img });
        };

        // --- AUTH SYNC ---
        onAuthStateChanged(auth, (u) => {
            if(u) {
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('navbar').classList.remove('hidden');
                if(u.email === BOSS_EMAIL) document.getElementById('god-btn').classList.remove('hidden');
                syncMarket();
                syncOrders();
                changePage('shop');
            } else {
                document.getElementById('auth-page').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('navbar').classList.add('hidden');
            }
        });

    </script>
</body>
    </html>
