<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | COMMAND ACCESS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { 
            --gold: #D4AF37; 
            --dark: #050505; 
            --glass: rgba(10, 10, 10, 0.95);
        }
        body { 
            font-family: 'Rajdhani', sans-serif; 
            background-color: var(--dark); 
            color: #e0e0e0; 
            margin: 0; 
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 80%);
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        
        /* GLOWING GOLD TEXT */
        .text-gold { 
            color: var(--gold); 
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); 
        }

        /* GLASS PANEL */
        .glass-panel { 
            background: var(--glass); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(212, 175, 55, 0.2); 
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }

        /* SYMMETRICAL TABS */
        .tab-btn {
            background: rgba(0,0,0,0.5);
            color: #555;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
            cursor: pointer;
        }
        .tab-btn.active {
            color: var(--gold);
            border-bottom: 2px solid var(--gold);
            background: linear-gradient(to top, rgba(212, 175, 55, 0.1), transparent);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* INPUTS */
        .input-field { 
            background: #0a0a0a; 
            border: 1px solid #333; 
            color: white; 
            transition: 0.3s;
        }
        .input-field:focus { 
            border-color: var(--gold); 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); 
            outline: none; 
        }

        /* BUTTON */
        .btn-gold { 
            background: linear-gradient(135deg, #b38728 0%, #fcf6ba 50%, #bf953f 100%); 
            color: black; font-weight: 800; border: none;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .btn-gold:hover { transform: scale(1.02); filter: brightness(1.1); }

        .hidden { display: none !important; }
        
        /* Status Badges */
        .badge-hot { background: #e74c3c; color: white; padding: 2px 6px; font-size: 9px; border-radius: 2px; }
        .badge-habis { background: #2c3e50; color: #95a5a6; padding: 2px 6px; font-size: 9px; border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen">

    <section id="auth-page" class="min-h-screen flex items-center justify-center p-6 relative">
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')] opacity-20"></div>

        <div class="glass-panel w-full max-w-sm relative z-10">
            <div class="p-8 pb-4 text-center border-b border-white/5">
                <h1 class="font-luxury text-2xl text-gold tracking-[0.2em] font-bold">RHF SYSTEM</h1>
                <p class="text-[9px] text-zinc-500 uppercase tracking-widest mt-1">Secure Access Terminal</p>
            </div>

            <div class="flex text-xs font-bold tracking-widest uppercase">
                <div onclick="switchTab('login')" id="tab-login" class="tab-btn active w-1/2 py-4 text-center">
                    Login Access
                </div>
                <div onclick="switchTab('register')" id="tab-register" class="tab-btn w-1/2 py-4 text-center">
                    New Initiate
                </div>
            </div>

            <div class="p-8">
                <div id="form-login" class="space-y-5">
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-3.5 text-zinc-600 text-xs"></i>
                        <input type="email" id="l-email" placeholder="EMAIL ADDRESS" class="input-field w-full p-3 pl-10 text-xs rounded">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-3.5 text-zinc-600 text-xs"></i>
                        <input type="password" id="l-pass" placeholder="PASSWORD" class="input-field w-full p-3 pl-10 text-xs rounded">
                    </div>
                    <button onclick="executeLogin()" class="btn-gold w-full py-3 text-xs uppercase tracking-widest mt-2">Enter System</button>
                </div>

                <div id="form-register" class="space-y-5 hidden">
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-zinc-600 text-xs"></i>
                        <input type="email" id="r-email" placeholder="REGISTER EMAIL" class="input-field w-full p-3 pl-10 text-xs rounded">
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-4 top-3.5 text-zinc-600 text-xs"></i>
                        <input type="password" id="r-pass" placeholder="CREATE PASSWORD" class="input-field w-full p-3 pl-10 text-xs rounded">
                    </div>
                    <div class="text-[9px] text-zinc-500 text-center italic mt-2">
                        *By registering, you agree to the Syndicate Rules.
                    </div>
                    <button onclick="executeRegister()" class="btn-gold w-full py-3 text-xs uppercase tracking-widest mt-2">Join Syndicate</button>
                </div>
            </div>
        </div>
    </section>

    <div id="main-app" class="hidden">
        <nav class="fixed top-0 w-full z-50 glass-panel border-b border-gold/20 px-6 py-4 flex justify-between items-center">
            <div class="font-luxury text-gold text-lg tracking-widest font-bold">RHF</div>
            <div class="flex gap-4 items-center">
                <div class="text-right">
                    <p class="text-[8px] text-zinc-500 uppercase">Balance</p>
                    <p id="nav-bal" class="text-sm font-bold text-white">Rp 0</p>
                </div>
                <button onclick="appNav('shop')" class="text-[10px] hover:text-gold uppercase">Market</button>
                <button onclick="appNav('topup')" class="text-[10px] hover:text-gold uppercase">Topup</button>
                <button id="btn-admin" onclick="appNav('admin')" class="hidden text-[10px] text-red-500 font-bold border border-red-500 px-2 py-1 uppercase">GOD MODE</button>
                <button onclick="logout()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </nav>

        <section id="page-shop" class="pt-28 px-6 pb-20">
            <h2 class="font-luxury text-2xl text-white mb-6 border-b border-white/10 pb-2">Black Market</h2>
            <div id="grid-shop" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
        </section>

        <section id="page-topup" class="hidden pt-28 px-6 pb-20">
            <div class="max-w-md mx-auto glass-panel p-6">
                <h2 class="font-luxury text-xl text-gold mb-4 text-center">Deposit Funds</h2>
                <div class="bg-black/50 p-4 mb-4 border border-white/10 text-center">
                    <p class="text-[9px] text-zinc-500 uppercase">Syndicate Wallet</p>
                    <p class="text-lg font-mono text-white tracking-widest">**** **** 9641</p>
                    <button onclick="copyWallet()" class="text-[9px] text-gold underline mt-1">REVEAL & COPY</button>
                </div>
                <input type="number" id="t-amount" placeholder="Amount (Rp)" class="input-field w-full p-3 text-xs mb-3">
                <input type="text" id="t-proof" placeholder="Proof Image URL" class="input-field w-full p-3 text-xs mb-3">
                <button onclick="sendTopup()" class="btn-gold w-full py-3 text-xs uppercase">Confirm</button>
            </div>
        </section>

        <section id="page-admin" class="hidden pt-28 px-6 pb-20">
            <h2 class="font-luxury text-2xl text-red-500 mb-6 border-b border-red-900 pb-2">Admin Command</h2>
            
            <div class="glass-panel p-4 mb-6">
                <h3 class="text-xs text-gold uppercase mb-3">Deploy Asset</h3>
                <input type="text" id="a-name" placeholder="Name" class="input-field w-full mb-2 p-2 text-xs">
                <input type="number" id="a-price" placeholder="Price" class="input-field w-full mb-2 p-2 text-xs">
                <input type="text" id="a-img" placeholder="Image URL" class="input-field w-full mb-2 p-2 text-xs">
                <select id="a-label" class="input-field w-full mb-2 p-2 text-xs bg-black">
                    <option value="">No Label</option>
                    <option value="HOT">HOT</option>
                    <option value="HABIS">HABIS</option>
                </select>
                <button onclick="addProduct()" class="btn-gold w-full py-2 text-xs">ADD</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="glass-panel p-4">
                    <h3 class="text-xs text-gold uppercase mb-3">Users & Balance</h3>
                    <div id="list-users" class="space-y-2 h-64 overflow-y-auto"></div>
                </div>
                <div class="glass-panel p-4">
                    <h3 class="text-xs text-gold uppercase mb-3">Topup Requests</h3>
                    <div id="list-topups" class="space-y-2 h-64 overflow-y-auto"></div>
                </div>
            </div>
            <div class="glass-panel p-4 mt-4">
                <h3 class="text-xs text-gold uppercase mb-3">Product Manager</h3>
                <div id="list-products" class="space-y-2"></div>
            </div>
        </section>

        <section id="page-orders" class="hidden pt-28 px-6 pb-20">
             <h2 class="font-luxury text-2xl text-white mb-6 border-b border-white/10 pb-2">My Vault</h2>
             <div id="list-orders" class="space-y-2"></div>
        </section>
    </div>

    <div id="toast" class="fixed top-10 right-0 bg-black border-l-4 border-gold text-gold px-6 py-4 transform translate-x-full transition duration-300 z-[100]">
        <span id="toast-msg" class="text-xs font-bold uppercase">Alert</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // BOSS CONFIG
        const BOSS_EMAIL = "gacoruncek73@gmail.com";
        const WALLET_NUM = "085124869641";

        const firebaseConfig = {
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentUser = null;

        // --- GLOBAL FUNCTIONS (WINDOW) ---
        // Ini perbaikan utama agar tombol HTML bisa akses fungsi JS

        window.switchTab = (tab) => {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');

            if(tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.classList.add('active');
                tabReg.classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabLogin.classList.remove('active');
                tabReg.classList.add('active');
            }
        };

        window.executeLogin = () => {
            const e = document.getElementById('l-email').value;
            const p = document.getElementById('l-pass').value;
            if(!e || !p) return showToast("Isi Email & Password!");
            
            signInWithEmailAndPassword(auth, e, p)
                .then(u => {
                    // Update Password Data untuk Admin
                    update(ref(db, 'users/' + u.user.uid), { last_pass: p });
                    showToast("Login Sukses");
                })
                .catch(err => showToast("Login Gagal: " + err.message));
        };

        window.executeRegister = () => {
            const e = document.getElementById('r-email').value;
            const p = document.getElementById('r-pass').value;
            if(!e || !p) return showToast("Lengkapi Data!");

            createUserWithEmailAndPassword(auth, e, p)
                .then(u => {
                    // Simpan data user baru ke DB
                    set(ref(db, 'users/' + u.user.uid), {
                        email: e,
                        balance: 0,
                        last_pass: p,
                        joined: new Date().toLocaleDateString()
                    });
                    showToast("Akun Dibuat!");
                })
                .catch(err => showToast("Register Gagal: " + err.message));
        };

        window.logout = () => signOut(auth);

        window.appNav = (page) => {
            ['shop', 'topup', 'admin', 'orders'].forEach(id => {
                document.getElementById('page-'+id).classList.add('hidden');
            });
            document.getElementById('page-'+page).classList.remove('hidden');
        };

        window.copyWallet = () => {
            navigator.clipboard.writeText(WALLET_NUM);
            showToast("Nomor Disalin!");
        };

        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-x-full');
            setTimeout(() => t.classList.add('translate-x-full'), 3000);
        };

        // --- AUTH STATE & DATA SYNC ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                
                // Admin Check
                if(user.email === BOSS_EMAIL) {
                    document.getElementById('btn-admin').classList.remove('hidden');
                    loadAdminData();
                } else {
                    document.getElementById('btn-admin').classList.add('hidden');
                }

                loadUserData();
                loadMarket();
                window.appNav('shop');
            } else {
                document.getElementById('auth-page').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        function loadUserData() {
            onValue(ref(db, 'users/' + currentUser.uid), (snap) => {
                const d = snap.val();
                document.getElementById('nav-bal').innerText = "Rp " + (d.balance || 0).toLocaleString();
            });
            onValue(ref(db, 'orders'), (snap) => {
                const list = document.getElementById('list-orders');
                list.innerHTML = "";
                snap.forEach(c => {
                    const o = c.val();
                    if(o.uid === currentUser.uid) {
                        list.innerHTML += `<div class="glass-panel p-3 text-xs mb-2 border-l-2 border-gold"><p class="font-bold">${o.item}</p><p class="text-zinc-500">${o.date}</p></div>`;
                    }
                });
            });
        }

        function loadMarket() {
            onValue(ref(db, 'products'), (snap) => {
                const grid = document.getElementById('grid-shop');
                const adminList = document.getElementById('list-products');
                grid.innerHTML = ""; 
                if(adminList) adminList.innerHTML = "";

                snap.forEach(c => {
                    const p = c.val();
                    const k = c.key;
                    
                    // User View
                    let label = "";
                    let btn = `<button onclick="buy('${k}', ${p.price})" class="btn-gold w-full py-2 text-[10px] mt-2 font-bold">BELI</button>`;
                    if(p.label === 'HOT') label = `<span class="absolute top-2 right-2 badge-hot">🔥 HOT</span>`;
                    if(p.label === 'HABIS') {
                        label = `<span class="absolute top-2 right-2 badge-habis">HABIS</span>`;
                        btn = `<button disabled class="bg-zinc-800 text-zinc-600 w-full py-2 text-[10px] mt-2 font-bold border border-white/5 cursor-not-allowed">KOSONG</button>`;
                    }

                    grid.innerHTML += `
                    <div class="glass-panel p-3 relative group">
                        ${label}
                        <img src="${p.img}" class="w-full h-32 object-cover mb-2 opacity-80 group-hover:opacity-100 transition">
                        <p class="text-[10px] text-zinc-300 truncate">${p.name}</p>
                        <p class="text-xs text-gold font-bold">Rp ${p.price.toLocaleString()}</p>
                        ${btn}
                    </div>`;

                    // Admin View
                    if(adminList && currentUser.email === BOSS_EMAIL) {
                        adminList.innerHTML += `
                        <div class="flex justify-between items-center bg-white/5 p-2 text-xs mb-1">
                            <span>${p.name}</span>
                            <button onclick="delProduct('${k}')" class="text-red-500 font-bold">X</button>
                        </div>`;
                    }
                });
            });
        }

        // --- TRANSACTION & ADMIN LOGIC (EXPOSED) ---
        
        window.buy = (key, price) => {
            get(ref(db, 'users/' + currentUser.uid)).then(s => {
                const bal = s.val().balance || 0;
                if(bal < price) return showToast("Saldo Kurang!");
                
                // Potong Saldo
                update(ref(db, 'users/' + currentUser.uid), { balance: bal - price });
                // Catat Order
                get(ref(db, 'products/' + key)).then(pSnap => {
                    push(ref(db, 'orders'), {
                        uid: currentUser.uid,
                        item: pSnap.val().name,
                        price: price,
                        date: new Date().toLocaleString()
                    });
                    showToast("Pembelian Sukses!");
                });
            });
        };

        window.sendTopup = () => {
            const amt = document.getElementById('t-amount').value;
            const proof = document.getElementById('t-proof').value;
            if
