<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RHF SUPREME MARKET</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:linear-gradient(135deg,#0a0a0a,#1a1a1a);color:white}
header{display:flex;justify-content:space-between;align-items:center;padding:15px;background:#000;border-bottom:1px solid gold;position:sticky;top:0}
.logo{color:gold;font-weight:600;letter-spacing:2px}
.container{padding:20px;max-width:700px;margin:auto}
.card{background:#111;padding:20px;border-radius:15px;margin-bottom:15px;border:1px solid #222}
input{width:100%;padding:10px;margin:6px 0;background:#0f0f0f;border:1px solid #333;color:white;border-radius:8px}
button{padding:10px;width:100%;margin-top:10px;border:none;border-radius:8px;background:linear-gradient(45deg,gold,#d4af37);font-weight:600;cursor:pointer}
button:hover{opacity:0.85}
.product{background:#1a1a1a;padding:15px;border-radius:10px;margin:10px 0;border:1px solid #222}
.product img{width:100%;height:160px;object-fit:cover;border-radius:8px;margin-bottom:10px}
.hidden{display:none}
.badge{padding:10px;border:1px solid gold;color:gold;border-radius:8px;margin-bottom:10px;text-align:center}
.cart{background:#111;padding:15px;border-radius:10px;margin-top:15px;border:1px solid gold}
.admin{border:1px solid gold}
small{opacity:0.6}
</style>
</head>
<body>

<header>
<div class="logo">RHF SUPREME</div>
<div id="saldoTop"></div>
</header>

<div class="container">

<div id="loginBox" class="card">
<h3>Login / Register</h3>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<input id="pin" type="password" placeholder="PIN 4 Digit">
<button onclick="login()">Login</button>
<button onclick="register()">Register</button>
</div>

<div id="appBox" class="hidden">

<div id="securityBadge"></div>

<input id="search" placeholder="Cari Produk..." onkeyup="searchProduct()">

<div id="productList"></div>

<div id="cartBox" class="cart hidden">
<h4>Keranjang</h4>
<div id="cartItems"></div>
<button onclick="checkout()">Checkout</button>
</div>

<div id="adminPanel" class="card admin hidden">
<h3>ADMIN RHF</h3>

<h4>Tambah Produk</h4>
<input id="pName" placeholder="Nama">
<input id="pPrice" placeholder="Harga">
<input id="pImage" placeholder="URL HTTPS">
<button onclick="addProduct()">Tambah</button>

<hr><br>

<h4>Kelola Saldo</h4>
<input id="targetUser" placeholder="Username">
<input id="saldoAmount" placeholder="Jumlah">
<button onclick="addSaldo()">Tambah Saldo</button>
<button onclick="reduceSaldo()">Kurangi Saldo</button>

<hr><br>

<h4>Aktifkan Verified</h4>
<input id="secureUser" placeholder="Username">
<button onclick="activateHTTPS()">Aktifkan Verified</button>

</div>

<button onclick="logout()">Logout</button>

</div>
</div>

<script>
// FIREBASE CONFIG
const firebaseConfig={
apiKey:"AIzaSyDSSgsUkgH7k2zS7D1dAzGcnlygTK9j9Qo",
authDomain:"rhf-shop-mafia.firebaseapp.com",
databaseURL:"https://rhf-shop-mafia-default-rtdb.firebaseio.com",
projectId:"rhf-shop-mafia",
storageBucket:"rhf-shop-mafia.firebasestorage.app",
messagingSenderId:"732783940571",
appId:"1:732783940571:web:425b43340e654e829bcdfe"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let currentUser=null;
let usersCache={};
let cart=[];
let logoutTimer=null;

// HASH
async function hash(text){
const msg=new TextEncoder().encode(text);
const buf=await crypto.subtle.digest('SHA-256',msg);
return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// REGISTER
async function register(){
let u=username.value;
let p=password.value;
let pinCode=pin.value;
if(!u||!p||pinCode.length!==4)return alert("Lengkapi data");

let passHash=await hash(p);
let pinHash=await hash(pinCode);

db.ref("users/"+u).set({
password:passHash,
pin:pinHash,
saldo:100000,
role:"user",
verified:false
});

alert("Register berhasil");
}

// LOGIN
async function login(){
let u=username.value;
let p=password.value;
let pinCode=pin.value;

let snap=await db.ref("users/"+u).once("value");
if(!snap.exists())return alert("User tidak ada");

let data=snap.val();
let passHash=await hash(p);
let pinHash=await hash(pinCode);

if(passHash!==data.password||pinHash!==data.pin)return alert("Login gagal");

currentUser=u;
usersCache[u]=data;

startApp();
}

// START
function startApp(){
loginBox.classList.add("hidden");
appBox.classList.remove("hidden");

saldoTop.innerText="Saldo: Rp "+usersCache[currentUser].saldo;

if(usersCache[currentUser].verified){
securityBadge.innerHTML="<div class='badge'>🛡 VERIFIED SECURITY ACTIVE</div>";
}

if(currentUser==="RHF"){
adminPanel.classList.remove("hidden");
}

loadProducts();
startAutoLogout();
}

// AUTO LOGOUT 1 JAM
function startAutoLogout(){
clearTimeout(logoutTimer);
logoutTimer=setTimeout(()=>{
alert("Session habis 1 jam");
logout();
},3600000);
}

// LOAD PRODUK
function loadProducts(){
db.ref("products").on("value",snap=>{
productList.innerHTML="";
snap.forEach(child=>{
let p=child.val();
productList.innerHTML+=`
<div class="product">
<img src="${p.image}">
<h4>${p.name}</h4>
<p>Rp ${p.price}</p>
<button onclick="addCart(${p.price})">Beli</button>
</div>`;
});
});
}

// CART
function addCart(price){
cart.push(price);
cartBox.classList.remove("hidden");
renderCart();
}
function renderCart(){
let total=0;
cartItems.innerHTML="";
cart.forEach(p=>{
total+=p;
cartItems.innerHTML+="<p>Rp "+p+"</p>";
});
cartItems.innerHTML+="<hr>Total: Rp "+total;
}

// CHECKOUT
function checkout(){
let total=cart.reduce((a,b)=>a+b,0);
if(usersCache[currentUser].saldo<total)return alert("Saldo kurang");

usersCache[currentUser].saldo-=total;
db.ref("users/"+currentUser).update({saldo:usersCache[currentUser].saldo});
saldoTop.innerText="Saldo: Rp "+usersCache[currentUser].saldo;
cart=[];
renderCart();
alert("Berhasil beli");
}

// ADMIN
function addProduct(){
db.ref("products").push({
name:pName.value,
price:parseInt(pPrice.value),
image:pImage.value
});
alert("Produk ditambah");
}

function addSaldo(){
db.ref("users/"+targetUser.value).once("value").then(snap=>{
let d=snap.val();
db.ref("users/"+targetUser.value).update({saldo:d.saldo+parseInt(saldoAmount.value)});
alert("Saldo ditambah");
});
}

function reduceSaldo(){
db.ref("users/"+targetUser.value).once("value").then(snap=>{
let d=snap.val();
db.ref("users/"+targetUser.value).update({saldo:d.saldo-parseInt(saldoAmount.value)});
alert("Saldo dikurangi");
});
}

function activateHTTPS(){
db.ref("users/"+secureUser.value).update({verified:true});
alert("Verified aktif");
}

// SEARCH
function searchProduct(){
let key=search.value.toLowerCase();
document.querySelectorAll(".product").forEach(p=>{
p.style.display=p.innerText.toLowerCase().includes(key)?"block":"none";
});
}

// LOGOUT
function logout(){
location.reload();
}

// AUTO CREATE ADMIN
db.ref("users/RHF").once("value").then(snap=>{
if(!snap.exists()){
hash("RHF").then(hp=>{
hash("9999").then(hpin=>{
db.ref("users/RHF").set({
password:hp,
pin:hpin,
saldo:999999999,
role:"admin",
verified:true
});
});
});
}
});
</script>

</body>
</html>
