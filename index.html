<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>404 NOT FOUND</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #fff; color: #000; font-family: sans-serif; }
        .hidden { display: none !important; }
        .input-gate { background: #000; color: #fff; border: 1px solid #333; padding: 10px; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="decoy" class="h-screen flex items-center justify-center text-center">
        <div>
            <h1 class="text-8xl font-bold">404</h1>
            <p>This site has been seized for unauthorized activities.</p>
        </div>
    </div>

    <div id="auth-gate" class="hidden h-screen flex items-center justify-center bg-black">
        <div class="w-80 p-8 border border-zinc-800">
            <h2 class="text-white font-bold mb-6 tracking-widest text-center">RHF SYNDICATE</h2>
            <input type="email" id="email" placeholder="IDENTITY" class="input-gate">
            <input type="password" id="pass" placeholder="KEY" class="input-gate">
            <button onclick="handleLogin()" class="w-full bg-yellow-600 text-black py-2 font-bold hover:bg-yellow-500">SYNC</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const ADMIN_IP = "203.190.43.100";

        // Deteksi IP
        async function securityCheck() {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            const myIP = data.ip;

            onValue(ref(db, 'settings/allowed_ips'), (snap) => {
                let allowed = (myIP === ADMIN_IP);
                snap.forEach(c => { if(c.val().ip === myIP) allowed = true; });

                if(allowed) {
                    document.getElementById('decoy').classList.add('hidden');
                    document.getElementById('auth-gate').classList.remove('hidden');
                }
            });
        }
        securityCheck();

        window.handleLogin = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("ACCESS DENIED"));
        };

        onAuthStateChanged(auth, (user) => {
            if(user) {
                if(user.email === "admin@rhf.com") window.location.href = "admin.html";
                else window.location.href = "buyer.html";
            }
        });
    </script>
</body>
</html>
