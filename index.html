<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA UNDERGROUND | Exclusive Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e5e5; }
        .gold-gradient { background: linear-gradient(45deg, #d4af37, #f9e2af); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .mafia-card { background: rgba(20, 20, 20, 0.8); border: 1px solid #333; transition: 0.3s; }
        .mafia-card:hover { border-color: #d4af37; box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .admin-panel { display: none; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #d4af37; }
    </style>
</head>
<body>

    <nav class="p-6 border-b border-zinc-800 flex justify-between items-center bg-black sticky top-0 z-50">
        <h1 class="text-2xl font-black tracking-tighter gold-gradient">MAFIA SHOP</h1>
        <div id="nav-links">
            <button onclick="showSection('shop')" class="mx-3 hover:text-yellow-500">Market</button>
            <button id="admin-btn" onclick="showSection('admin')" class="hidden mx-3 text-red-500 font-bold border border-red-500 px-2">ADMIN PANEL</button>
            <button id="login-btn" onclick="showSection('login')" class="bg-yellow-600 text-black px-4 py-1 font-bold">LOG IN</button>
            <button id="logout-btn" class="hidden bg-zinc-800 px-4 py-1">EXIT</button>
        </div>
    </nav>

    <section id="shop-section" class="p-8">
        <h2 class="text-4xl font-bold mb-8">EXCLUSIVE <span class="gold-gradient">COLLECTION</span></h2>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </section>

    <section id="login-section" class="hidden min-h-screen flex items-center justify-center p-8">
        <div class="mafia-card p-10 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center">IDENTIFY YOURSELF</h2>
            <input type="email" id="email" placeholder="Email" class="w-full bg-zinc-900 border border-zinc-700 p-3 mb-4 focus:outline-none focus:border-yellow-500">
            <input type="password" id="password" placeholder="Password" class="w-full bg-zinc-900 border border-zinc-700 p-3 mb-6 focus:outline-none focus:border-yellow-500">
            <button id="do-login" class="w-full bg-yellow-600 text-black font-bold p-3 hover:bg-yellow-500">ENTER THE SYSTEM</button>
        </div>
    </section>

    <section id="admin-section" class="hidden p-8">
        <h2 class="text-3xl font-black text-red-600 mb-8">BOSS CONTROL CENTER</h2>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div class="mafia-card p-6">
                <h3 class="text-xl font-bold mb-4 text-yellow-500 underline">Manage Inventory</h3>
                <input type="text" id="p-name" placeholder="Item Name" class="w-full bg-zinc-800 p-2 mb-2">
                <input type="text" id="p-price" placeholder="Price (e.g. $50,000)" class="w-full bg-zinc-800 p-2 mb-2">
                <input type="text" id="p-img" placeholder="Image URL (https://...)" class="w-full bg-zinc-800 p-2 mb-4">
                <button onclick="addProduct()" class="w-full bg-green-700 text-white p-2 font-bold">ADD TO MARKET</button>
            </div>

            <div class="mafia-card p-6">
                <h3 class="text-xl font-bold mb-4 text-yellow-500 underline">Real-time Operatives (Users)</h3>
                <div id="user-list" class="space-y-2 text-sm">
                    </div>
            </div>
        </div>
    </section>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSSgsUkgH7k2zS7D1dAzGcnlygTK9j9Qo",
            authDomain: "rhf-shop-mafia.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia",
            storageBucket: "rhf-shop-mafia.firebasestorage.app",
            messagingSenderId: "732783940571",
            appId: "1:732783940571:web:425b43340e654e829bcdfe",
            measurementId: "G-WDHKC3RFX3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- AUTH LOGIC ---
        window.showSection = (section) => {
            ['shop', 'login', 'admin'].forEach(s => document.getElementById(s + '-section').classList.add('hidden'));
            document.getElementById(section + '-section').classList.remove('hidden');
        };

        document.getElementById('do-login').onclick = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert(err.message));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                showSection('shop');
                // Cek jika admin (contoh sederhana: email tertentu adalah bos)
                if (user.email === "admin@mafia.com") {
                    document.getElementById('admin-btn').classList.remove('hidden');
                }
                // Catat user login ke Database
                set(ref(db, 'online_users/' + user.uid), {
                    email: user.email,
                    lastActive: new Date().toLocaleString()
                });
            } else {
                document.getElementById('login-btn').classList.remove('remove');
                document.getElementById('logout-btn').classList.add('hidden');
                document.getElementById('admin-btn').classList.add('hidden');
                showSection('login');
            }
        });

        // --- PRODUCT LOGIC ---
        window.addProduct = () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            if(name && price && img) {
                push(ref(db, 'products'), { name, price, img });
                alert("Barang telah masuk ke gudang, Boss.");
            }
        };

        onValue(ref(db, 'products'), (snapshot) => {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <div class="mafia-card overflow-hidden">
                        <img src="${data.img}" class="w-full h-48 object-cover grayscale hover:grayscale-0 transition duration-500">
                        <div class="p-4">
                            <h4 class="font-bold text-lg">${data.name}</h4>
                            <p class="text-yellow-500 font-mono">${data.price}</p>
                            <button class="mt-4 w-full border border-zinc-700 py-2 hover:bg-white hover:text-black transition">BUY NOW</button>
                        </div>
                    </div>
                `;
            });
        });

        // --- ADMIN MONITORING ---
        onValue(ref(db, 'online_users'), (snapshot) => {
            const userList = document.getElementById('user-list');
            userList.innerHTML = "";
            snapshot.forEach((child) => {
                const u = child.val();
                userList.innerHTML += `
                    <div class="flex justify-between border-b border-zinc-800 pb-1">
                        <span class="text-green-400">● ${u.email}</span>
                        <span class="text-zinc-500 italic">${u.lastActive}</span>
                    </div>
                `;
            });
        });

    </script>
</body>
</html>
