<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sembunyikan semua konten secara default */
        #secure-content { display: none; }
        body { background: #fff; color: #000; }
    </style>
</head>
<body>

    <div id="fake-404" class="h-screen w-full flex items-center justify-center p-10">
        <div class="max-w-xl">
            <h1 class="text-6xl font-sans mb-2">404. <span class="text-zinc-500 font-light text-4xl">That’s an error.</span></h1>
            <p class="text-lg text-zinc-600 mt-6">
                The requested URL was not found on this server. <ins class="text-zinc-400 no-underline">That’s all we know.</ins>
            </p>
            <p class="text-xs text-zinc-300 mt-20 font-mono">Status: Forbidden / Access Denied by Global Firewall</p>
        </div>
    </div>

    <div id="secure-content" class="min-h-screen bg-black text-white flex items-center justify-center p-6">
        <div class="bg-zinc-900 p-10 rounded-[40px] border border-yellow-500/20 w-full max-w-sm text-center shadow-2xl">
            <h1 class="text-2xl font-bold mb-8 text-yellow-500 tracking-tighter">AUTHENTICATION REQUIRED</h1>
            
            <div class="space-y-4">
                <input type="email" id="email" placeholder="OPERATIVE EMAIL" class="w-full p-4 bg-black rounded-2xl border border-zinc-800 outline-none focus:border-yellow-500 text-sm">
                <input type="password" id="password" placeholder="ACCESS KEY" class="w-full p-4 bg-black rounded-2xl border border-zinc-800 outline-none focus:border-yellow-500 text-sm">
                <button onclick="processLogin()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl uppercase tracking-[0.2em] mt-4 hover:bg-white transition">Verify Access</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- PROSEDUR LOCKDOWN IP ---
        async function runSecurityCheck() {
            try {
                // 1. Ambil IP publik pengunjung
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                const currentIP = data.ip;

                // 2. Ambil whitelist dari Firebase
                const ipRef = ref(db, 'admin_config/whitelisted_ips');
                const snapshot = await get(ipRef);
                const allowedIPs = snapshot.val() ? Object.values(snapshot.val()) : [];

                // 3. Verifikasi
                if (allowedIPs.includes(currentIP)) {
                    // IP TERDAFTAR: Buka gembok
                    document.getElementById('fake-404').style.display = 'none';
                    document.getElementById('secure-content').style.display = 'flex';
                    document.body.style.backgroundColor = "#000";
                    document.title = "RHF | SECURE ACCESS";
                } else {
                    // IP TIDAK TERDAFTAR: Biarkan di halaman 404
                    console.log("Unauthorized Access Detected from IP: " + currentIP);
                }
            } catch (error) {
                console.error("Shield Error: " + error);
            }
        }

        // Jalankan pengecekan saat halaman dimuat
        runSecurityCheck();

        // Fungsi Login
        window.processLogin = () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            signInWithEmailAndPassword(auth, email, pass)
            .then((userCredential) => {
                const user = userCredential.user;
                if(user.email === "admin@rhf.com") {
                    window.location.replace("admin.html");
                } else {
                    window.location.replace("buyer.html");
                }
            })
            .catch(err => alert("ERROR: IDENTITAS TIDAK DIKENAL"));
        };
    </script>
</body>
</html>
