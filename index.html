<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | BLACK MARKET FINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        :root { --gold: #D4AF37; --dark: #050505; --glass: rgba(12, 12, 12, 0.98); }
        body { 
            font-family: 'Rajdhani', sans-serif; background: var(--dark); color: #ccc; margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 100%);
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass-panel { background: var(--glass); border: 1px solid rgba(212, 175, 55, 0.2); box-shadow: 0 0 30px rgba(0,0,0,1); }
        .btn-gold { 
            background: linear-gradient(90deg, #b38728, #fcf6ba, #bf953f); 
            color: #000; font-weight: 800; border: none; cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .input-field { background: #0a0a0a; border: 1px solid #333; color: white; padding: 12px; width: 100%; font-size: 13px; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: var(--gold); }
        .hidden { display: none !important; }
        .chat-bubble { max-width: 75%; padding: 10px; border-radius: 12px; font-size: 12px; margin-bottom: 8px; }
        .chat-me { background: #005c4b; color: #fff; align-self: flex-end; border-bottom-right-radius: 0; margin-left: auto; }
        .chat-other { background: #202c33; color: #fff; align-self: flex-start; border-bottom-left-radius: 0; }
    </style>
</head>
<body>

    <nav id="navbar" class="hidden fixed top-0 w-full z-50 glass-panel border-b border-gold/20 px-6 py-4 flex justify-between items-center">
        <h1 class="font-luxury text-gold text-2xl font-bold tracking-tighter">RHF</h1>
        <div class="flex items-center gap-6">
            <div class="text-right">
                <p id="user-bal" class="text-gold font-bold text-sm font-mono">Rp 0</p>
            </div>
            <button onclick="changePage('shop')" class="text-white hover:text-gold"><i class="fa-solid fa-house"></i></button>
            <button id="god-btn" onclick="changePage('admin')" class="hidden text-red-500 font-bold border border-red-500 px-2 animate-pulse">ADMIN</button>
            <button onclick="logout()" class="text-zinc-500 hover:text-red-500"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <section id="auth-page" class="min-h-screen flex items-center justify-center p-6 bg-black">
        <div class="glass-panel w-full max-w-sm p-10 text-center rounded-xl">
            <h1 class="font-luxury text-gold text-4xl mb-2">RHF</h1>
            <p class="text-[9px] text-zinc-500 tracking-[0.5em] mb-8 uppercase font-bold">Encrypted Syndicate</p>
            
            <div class="space-y-4">
                <input type="email" id="email" placeholder="CODENAME (EMAIL)" class="input-field rounded">
                <input type="password" id="pass" placeholder="PASSWORD" class="input-field rounded">
                
                <div class="flex gap-2 pt-4">
                    <button onclick="handleLogin()" class="btn-gold w-1/2 py-3 text-xs uppercase">Login</button>
                    <button onclick="handleReg()" class="border border-gold text-gold w-1/2 py-3 text-xs uppercase hover:bg-gold hover:text-black transition">Join</button>
                </div>
            </div>
            <p id="auth-msg" class="text-red-500 text-[10px] mt-4"></p>
        </div>
    </section>

    <div id="main-app" class="hidden">
        
        <section id="page-shop" class="pt-28 px-4 max-w-6xl mx-auto">
            <div class="flex justify-between items-end mb-8 border-b border-gold/10 pb-4">
                <h2 class="font-luxury text-white text-xl">Asset Market</h2>
                <button onclick="changePage('orders')" class="text-[10px] text-gold uppercase border border-gold/30 px-3 py-1">My Orders</button>
            </div>
            <div id="shop-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-orders" class="hidden pt-28 px-4 max-w-md mx-auto">
            <h2 class="font-luxury text-white text-xl mb-6 text-center">Your Operations</h2>
            <div id="order-list" class="space-y-4"></div>
        </section>

        <section id="page-admin" class="hidden pt-28 px-4 pb-20">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass-panel p-6">
                    <h3 class="text-gold mb-4 uppercase text-xs font-bold">Post New Asset</h3>
                    <input id="p-name" placeholder="Item Name" class="input-field mb-2">
                    <input id="p-price" type="number" placeholder="Price (Rp)" class="input-field mb-2">
                    <input id="p-img" placeholder="Image URL" class="input-field mb-2">
                    <button onclick="adminAddP()" class="btn-gold w-full py-2 mt-2">DEPLOY</button>
                    
                    <h3 class="text-gold mt-8 mb-4 uppercase text-xs font-bold">Ghost Voucher</h3>
                    <button onclick="generateVoucher()" class="bg-blue-900 text-blue-100 w-full py-3 text-[10px] font-bold">CREATE REDEEM CODE</button>
                </div>
                <div class="glass-panel p-6">
                    <h3 class="text-gold mb-4 uppercase text-xs font-bold">Intercepted Chats</h3>
                    <div id="adm-chat-list" class="h-64 overflow-y-auto space-y-2"></div>
                </div>
                <div class="glass-panel p-6 lg:col-span-2">
                    <h3 class="text-gold mb-4 uppercase text-xs font-bold">Incoming Orders</h3>
                    <div id="adm-orders" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>
            </div>
        </section>
    </div>

    <div id="address-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-md p-6 overflow-y-auto max-h-[90vh] rounded-lg">
            <h3 class="font-luxury text-gold text-xl mb-6 text-center">Shipping Protocol</h3>
            <div class="space-y-4">
                <input type="text" id="adr-name" placeholder="Full Name" class="input-field">
                <input type="tel" id="adr-phone" placeholder="Phone Number" class="input-field">
                <textarea id="adr-region" placeholder="Province, City, District, Postal Code" class="input-field h-20"></textarea>
                <textarea id="adr-street" placeholder="Street Name, No. House" class="input-field h-20"></textarea>
                <input type="text" id="adr-detail" placeholder="Note (Block/Floor)" class="input-field">
                
                <div class="flex gap-2">
                    <button onclick="setLabel('Rumah')" id="lbl-rumah" class="flex-1 py-2 border border-gold text-gold text-[10px]">HOME</button>
                    <button onclick="setLabel('Kantor')" id="lbl-kantor" class="flex-1 py-2 border border-zinc-700 text-zinc-500 text-[10px]">OFFICE</button>
                </div>
                <input type="hidden" id="adr-label" value="Rumah">

                <div class="pt-6 border-t border-white/10">
                    <p class="text-[10px] text-zinc-500 text-center mb-4 italic">Payment Assistance: <span class="text-gold">chhtty4@gmail.com</span></p>
                    <button onclick="saveAddressAndBuy()" class="btn-gold w-full py-4 text-sm tracking-widest uppercase">Process Order</button>
                </div>
            </div>
        </div>
    </div>

    <button id="chat-float" onclick="toggleChat()" class="hidden fixed bottom-6 right-6 w-14 h-14 bg-zinc-900 rounded-full flex items-center justify-center text-gold shadow-2xl z-[90] border border-gold/30">
        <i class="fa-solid fa-comment-dots text-2xl"></i>
    </button>

    <div id="chat-window" class="hidden fixed bottom-24 right-6 w-80 h-96 glass-panel z-[110] flex flex-col rounded-xl overflow-hidden shadow-2xl">
        <div class="bg-zinc-900 p-3 flex justify-between items-center border-b border-gold/20">
            <span class="text-[10px] text-gold font-bold uppercase tracking-widest">Admin Support</span>
            <button onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="chat-msgs" class="flex-1 overflow-y-auto p-4 flex flex-col bg-black/40"></div>
        <div class="p-2 bg-zinc-900 flex gap-2">
            <input type="text" id="chat-in" placeholder="Type here..." class="flex-1 bg-black border border-zinc-700 text-xs p-2 rounded text-white">
            <button onclick="sendMsg('user')" class="text-gold px-2"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, remove, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG
        const BOSS_MAIL = "gacoruncek73@gmail.com";
        const ADMIN_NOTIF = "chhtty4@gmail.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let selectedItem = null;

        // --- AUTH FUNCTIONS ---
        window.handleLogin = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => {
                document.getElementById('auth-msg').innerText = "FAILED: CODE INCORRECT";
            });
        };

        window.handleReg = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            createUserWithEmailAndPassword(auth, e, p).then(u => {
                set(ref(db, 'users/' + u.user.uid), { email: e, balance: 0 });
            }).catch(err => alert(err.message));
        };

        window.logout = () => signOut(auth);

        // --- NAVIGATION ---
        window.changePage = async (p) => {
            if(p === 'admin') {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                const allowedIPSnap = await get(ref(db, 'admin_settings/allowed_ip'));
                if(auth.currentUser.email === BOSS_MAIL && data.ip === allowedIPSnap.val()) {
                    showSec('page-admin');
                } else { 
                    alert("IP MISMATCH: ACCESS REJECTED"); 
                    showSec('page-shop');
                }
            } else { showSec('page-'+p); }
        };

        function showSec(id) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        // --- MONITORING AUTH ---
        onAuthStateChanged(auth, async (u) => {
            if(u) {
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('navbar').classList.remove('hidden');
                document.getElementById('chat-float').classList.remove('hidden');
                
                if(u.email === BOSS_MAIL) {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    update(ref(db, 'admin_settings'), { allowed_ip: data.ip });
                    document.getElementById('god-btn').classList.remove('hidden');
                    loadAdminData();
                }
                syncShop();
                syncUser(u.uid);
                loadChat(u.uid);
                showSec('page-shop');
            } else {
                document.getElementById('auth-page').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
                document.getElementById('navbar').classList.add('hidden');
            }
        });

        // --- MARKET LOGIC ---
        function syncShop() {
            onValue(ref(db, 'products'), s => {
                const g = document.getElementById('shop-grid'); g.innerHTML="";
                s.forEach(c => {
                    const p = c.val();
                    g.innerHTML += `
                    <div class="glass-panel p-4 flex flex-col rounded-lg">
                        <img src="${p.img}" class="h-32 object-cover rounded mb-4" onerror="this.src='https://via.placeholder.com/150'">
                        <h4 class="text-[11px] text-zinc-400 uppercase font-bold">${p.name}</h4>
                        <p class="text-gold font-bold mb-4">Rp ${p.price.toLocaleString()}</p>
                        <button onclick="openBuy('${c.key}', '${p.name}', ${p.price})" class="btn-gold py-2 text-[10px]">ORDER ASSET</button>
                    </div>`;
                });
            });
        }

        window.openBuy = (k, n, p) => {
            selectedItem = {k, n, p};
            document.getElementById('address-modal').classList.remove('hidden');
        };

        window.closeAddress = () => document.getElementById('address-modal').classList.add('hidden');

        window.saveAddressAndBuy = async () => {
            const uid = auth.currentUser.uid;
            const addr = {
                name: document.getElementById('adr-name').value,
                phone: document.getElementById('adr-phone').value,
                region: document.getElementById('adr-region').value,
                street: document.getElementById('adr-street').value,
                detail: document.getElementById('adr-detail').value,
                label: document.getElementById('adr-label').value
            };

            if(!addr.name || !addr.phone) return alert("Fill Name and Phone!");

            const uSnap = await get(ref(db, 'users/'+uid));
            const bal = uSnap.val().balance || 0;

            if(bal < selectedItem.p) {
                alert("Insufficient Balance. Contact admin for Top-Up.");
                return;
            }

            await update(ref(db, 'users/'+uid), { balance: bal - selectedItem.p });
            
            const orderObj = {
                uid: uid,
                email: auth.currentUser.email,
                item: selectedItem.n,
                price: selectedItem.p,
                address: addr,
                status: 'Wait Confirm',
                time: new Date().toLocaleString()
            };

            await push(ref(db, 'orders'), orderObj);
            
            // EMAIL NOTIFICATION
            console.log("NOTIFYING BOSS HQ: " + ADMIN_NOTIF);
            // EmailJS Trigger
            emailjs.send("service_id", "template_id", {
                to_email: ADMIN_NOTIF,
                from_name: "RHF SYSTEM",
                message: `ORDER BARU: ${selectedItem.n} dari ${auth.currentUser.email}. Alamat: ${addr.street}, ${addr.region}`
            });

            alert("ORDER SENT TO HQ!");
            window.closeAddress();
            window.changePage('orders');
        };

        // --- OTHER UTILS ---
        window.setLabel = (l) => {
            document.getElementById('adr-label').value = l;
            document.getElementById('lbl-rumah').className = l==='Rumah'?'flex-1 py-2 border border-gold text-gold text-[10px]':'flex-1 py-2 border border-zinc-700 text-zinc-500 text-[10px]';
            document.getElementById('lbl-kantor').className = l==='Kantor'?'flex-1 py-2 border border-gold text-gold text-[10px]':'flex-1 py-2 border border-zinc-700 text-zinc-500 text-[10px]';
        };

        function syncUser(uid) {
            onValue(ref(db, 'users/'+uid), s => {
                document.getElementById('user-bal').innerText = "Rp " + (s.val().balance||0).toLocaleString();
            });
            onValue(ref(db, 'orders'), s => {
                const l = document.getElementById('order-list'); l.innerHTML="";
                s.forEach(c => {
                    const o = c.val();
                    if(o.uid === uid) {
                        l.innerHTML += `<div class="glass-panel p-4 border-l-2 border-gold rounded">
                            <p class="text-[9px] text-zinc-500">${o.time}</p>
                            <h4 class="text-white text-xs font-bold uppercase">${o.item}</h4>
                            <p class="text-gold text-[10px]">${o.status}</p>
                        </div>`;
                    }
                });
            });
        }
        
        // --- CHAT & ADMIN LOGIC (SAMA SEPERTI SEBELUMNYA) ---
        window.toggleChat = () => document.getElementById('chat-window').classList.toggle('hidden');
        window.adminAddP = () => {
            const n = document.getElementById('p-name').value, p = document.getElementById('p-price').value, i = document.getElementById('p-img').value;
            if(n && p) push(ref(db, 'products'), { name: n, price: parseInt(p), img: i });
        };
        // (Lanjutkan fungsi admin/chat lainnya...)
    </script>
</body>
</html>
