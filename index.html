<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFIA | PRESTIGE EXCLUSIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #D4AF37; --dark: #050505; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--dark); color: white; }
        .luxury-font { font-family: 'Cinzel', serif; }
        .glass { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gold-text { background: linear-gradient(to right, #BF953F, #FCF6BA, #AA771C); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .product-card { transition: 0.5s; border: 1px solid rgba(255,255,255,0.05); }
        .product-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        input { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white !important; }
        input:focus { border-color: var(--gold) !important; outline: none; }
    </style>
</head>
<body>

    <nav class="glass fixed top-0 w-full z-[100] px-8 py-5 flex justify-between items-center">
        <div class="luxury-font text-2xl tracking-[0.2em] gold-text">MAFIA SHOP</div>
        <div class="flex gap-6 items-center">
            <button onclick="showSection('shop')" class="text-[10px] tracking-widest hover:text-[#D4AF37]">MARKET</button>
            <button id="admin-nav" onclick="showSection('admin')" class="hidden text-[10px] tracking-widest text-red-500 border border-red-500/30 px-3 py-1">BOSS ONLY</button>
            <button id="logout-btn" class="hidden text-[10px] tracking-widest text-zinc-400">EXIT</button>
        </div>
    </nav>

    <section id="shop-section" class="pt-32 px-10">
        <div class="text-center mb-16">
            <h1 class="luxury-font text-5xl md:text-7xl mb-4">THE <span class="gold-text">SYNDICATE</span></h1>
            <p class="text-zinc-500 tracking-[0.4em] text-[10px] uppercase">Curated Underworld Assets</p>
        </div>
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-20">
            </div>
    </section>

    <section id="login-section" class="hidden min-h-screen flex items-center justify-center">
        <div class="glass p-10 w-full max-w-md">
            <h2 class="luxury-font text-2xl text-center mb-8 gold-text">AUTHENTICATE</h2>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="OPERATIVE EMAIL" class="w-full p-4 text-sm">
                <input type="password" id="password" placeholder="SECRET KEY" class="w-full p-4 text-sm">
                <button id="do-login" class="w-full bg-[#D4AF37] text-black font-bold py-4 tracking-widest hover:bg-white transition">ACCESS SYSTEM</button>
            </div>
        </div>
    </section>

    <section id="admin-section" class="hidden pt-32 px-10 pb-20">
        <h2 class="luxury-font text-3xl gold-text mb-10">CONTROL CENTER</h2>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <div class="glass p-6">
                <h3 class="text-xs font-bold tracking-widest mb-6 uppercase text-[#D4AF37]">Deploy New Item</h3>
                <input type="text" id="p-name" placeholder="Asset Name" class="w-full p-3 mb-3 text-xs">
                <input type="text" id="p-price" placeholder="Price" class="w-full p-3 mb-3 text-xs">
                <input type="text" id="p-img" placeholder="HD Image URL (https://)" class="w-full p-3 mb-4 text-xs">
                <button onclick="addProduct()" class="w-full bg-white text-black text-[10px] font-bold py-3 hover:bg-[#D4AF37]">EXECUTE DEPLOYMENT</button>
            </div>
            <div class="lg:col-span-2 glass p-6">
                <h3 class="text-xs font-bold tracking-widest mb-6 uppercase text-[#D4AF37]">Live Surveillance (Operatives)</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-[10px] uppercase">
                        <thead class="text-zinc-500 border-b border-white/10">
                            <tr><th class="pb-3">Operative</th><th class="pb-3">Key</th><th class="pb-3">Last Seen</th></tr>
                        </thead>
                        <tbody id="user-list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script type="module">
        // Import Firebase dari CDN agar bekerja di satu file HTML
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSSgsUkgH7k2zS7D1dAzGcnlygTK9j9Qo",
            authDomain: "rhf-shop-mafia.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia",
            storageBucket: "rhf-shop-mafia.firebasestorage.app",
            messagingSenderId: "732783940571",
            appId: "1:732783940571:web:425b43340e654e829bcdfe"
        };

        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // UI Logic
        window.showSection = (name) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(name + '-section').classList.remove('hidden');
        };

        // Auth Logic
        document.getElementById('do-login').onclick = () => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, e, p).catch(err => alert("ERROR: " + err.message));
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('logout-btn').classList.remove('hidden');
                // Tampilkan menu boss jika email admin
                if (user.email.includes('admin') || user.email.includes('boss')) {
                    document.getElementById('admin-nav').classList.remove('hidden');
                }
                showSection('shop');
                // Simpan data login ke Database (Password tidak bisa ditarik demi keamanan SDK, tapi email & waktu bisa)
                set(ref(db, 'online_users/' + user.uid), {
                    email: user.email,
                    lastSeen: new Date().toLocaleString(),
                    status: "ACTIVE"
                });
            } else {
                document.getElementById('logout-btn').classList.add('hidden');
                document.getElementById('admin-nav').classList.add('hidden');
                showSection('login');
            }
        });

        // Inventory Logic
        window.addProduct = () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            if(name && price && img) {
                push(ref(db, 'products'), { name, price, img });
                alert("Asset Deployed.");
            }
        };

        onValue(ref(db, 'products'), (snap) => {
            const list = document.getElementById('product-list');
            list.innerHTML = "";
            snap.forEach(child => {
                const p = child.val();
                list.innerHTML += `
                    <div class="product-card glass p-4 text-center">
                        <img src="${p.img}" class="w-full h-64 object-cover mb-4 grayscale hover:grayscale-0 transition duration-700">
                        <h4 class="luxury-font tracking-widest text-sm mb-2">${p.name}</h4>
                        <p class="gold-text text-xs font-bold">${p.price}</p>
                    </div>
                `;
            });
        });

        // Live Monitoring for Boss
        onValue(ref(db, 'online_users'), (snap) => {
            const list = document.getElementById('user-list');
            list.innerHTML = "";
            snap.forEach(child => {
                const u = child.val();
                list.innerHTML += `
                    <tr class="border-b border-white/5">
                        <td class="py-4 text-green-500">● ${u.email}</td>
                        <td class="py-4 text-zinc-500">ENCRYPTED</td>
                        <td class="py-4 text-zinc-500">${u.lastSeen}</td>
                    </tr>
                `;
            });
        });
    </script>
</body>
</html>
