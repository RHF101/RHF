<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | BLACK MARKET SYNDICATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    
    <style>
        :root { --gold: #D4AF37; --dark: #050505; --glass: rgba(10, 10, 10, 0.95); }
        body { 
            font-family: 'Rajdhani', sans-serif; background: var(--dark); color: #ccc; margin: 0;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000 100%);
            overflow-x: hidden;
        }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass-panel { background: var(--glass); border: 1px solid rgba(212, 175, 55, 0.15); backdrop-filter: blur(15px); }
        .btn-gold { 
            background: linear-gradient(90deg, #b38728, #fcf6ba, #bf953f); 
            color: #000; font-weight: 800; border: none; cursor: pointer;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: 0.3s;
        }
        .btn-gold:hover { transform: scale(1.02); filter: brightness(1.1); }
        .input-field { background: #0a0a0a; border: 1px solid #222; color: white; padding: 12px; width: 100%; font-size: 13px; outline: none; border-radius: 4px; }
        .input-field:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
        .hidden { display: none !important; }
        
        /* Chat Design */
        .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
        .chat-me { background: #005c4b; color: white; align-self: flex-end; border-bottom-right-radius: 0; margin-left: auto; }
        .chat-other { background: #202c33; color: white; align-self: flex-start; border-bottom-left-radius: 0; }
    </style>
</head>
<body>

    <section id="auth-page" class="min-h-screen flex items-center justify-center p-6 z-[100] relative">
        <div class="glass-panel w-full max-w-sm p-10 text-center rounded-2xl border-gold/30">
            <h1 class="font-luxury text-gold text-4xl mb-2 tracking-tighter">RHF</h1>
            <p class="text-[10px] text-zinc-500 tracking-[0.6em] mb-10 uppercase">Secure Access Only</p>
            
            <div class="space-y-4">
                <input type="email" id="email" placeholder="EMAIL IDENTITY" class="input-field">
                <input type="password" id="pass" placeholder="SECURITY CODE" class="input-field">
                <button onclick="handleLogin()" class="btn-gold w-full py-4 text-xs tracking-widest mt-4">VERIFY IDENTITY</button>
                <button onclick="handleReg()" class="text-[10px] text-zinc-600 hover:text-gold transition uppercase tracking-widest">Apply for Membership</button>
            </div>
            <p id="auth-error" class="text-red-500 text-[10px] mt-4 font-bold"></p>
        </div>
    </section>

    <div id="main-app" class="hidden opacity-0 transition-opacity duration-1000">
        
        <nav class="fixed top-0 w-full z-50 glass-panel border-b border-gold/10 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-gold"></i>
                <h1 class="font-luxury text-gold text-xl tracking-tighter">RHF HQ</h1>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <p class="text-[9px] text-zinc-500 uppercase">Vault Balance</p>
                    <p id="user-bal" class="text-gold font-bold text-sm font-mono">Rp 0</p>
                </div>
                <button onclick="changePage('shop')" class="text-zinc-400 hover:text-gold"><i class="fa-solid fa-store"></i></button>
                <button onclick="changePage('orders')" class="text-zinc-400 hover:text-gold"><i class="fa-solid fa-dolly"></i></button>
                <button id="god-btn" onclick="changePage('admin')" class="hidden text-red-500 border border-red-500 px-2 py-0.5 text-[10px] font-bold animate-pulse">ADMIN</button>
                <button onclick="logout()" class="text-red-900 hover:text-red-500 transition"><i class="fa-solid fa-power-off"></i></button>
            </div>
        </nav>

        <section id="page-shop" class="pt-28 px-4 max-w-6xl mx-auto pb-20">
            <h2 class="font-luxury text-white text-2xl mb-8 border-l-4 border-gold pl-4 uppercase">Black Market Assets</h2>
            <div id="shop-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
        </section>

        <section id="page-orders" class="hidden pt-28 px-4 max-w-lg mx-auto pb-20">
            <h2 class="font-luxury text-white text-2xl mb-8 text-center uppercase">Active Operations</h2>
            <div id="order-list" class="space-y-4"></div>
        </section>

        <section id="page-admin" class="hidden pt-28 px-6 pb-24">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="glass-panel p-6 rounded-lg">
                    <h3 class="text-gold text-xs font-bold uppercase mb-6 border-b border-white/10 pb-2">Deploy Asset</h3>
                    <div class="space-y-3">
                        <input id="p-name" placeholder="Asset Name" class="input-field">
                        <input id="p-price" type="number" placeholder="Price" class="input-field">
                        <input id="p-img" placeholder="Image URL" class="input-field">
                        <button onclick="adminAddP()" class="btn-gold w-full py-3 text-[10px]">DEPLOY TO MARKET</button>
                    </div>
                </div>

                <div class="glass-panel p-6 rounded-lg flex flex-col h-[500px]">
                    <h3 class="text-gold text-xs font-bold uppercase mb-4 border-b border-white/10 pb-2">Chat Intercepts</h3>
                    <div id="adm-chat-list" class="flex-1 overflow-y-auto space-y-3"></div>
                </div>

                <div class="glass-panel p-6 rounded-lg flex flex-col h-[500px]">
                    <h3 class="text-gold text-xs font-bold uppercase mb-4 border-b border-white/10 pb-2">Live Logs</h3>
                    <div id="adm-orders" class="flex-1 overflow-y-auto space-y-3"></div>
                </div>
            </div>
        </section>
    </div>

    <div id="address-modal" class="hidden fixed inset-0 bg-black/98 z-[200] flex items-center justify-center p-4 backdrop-blur-xl">
        <div class="glass-panel w-full max-w-md p-8 rounded-2xl border-gold/30">
            <h3 class="font-luxury text-gold text-xl mb-6">SHIPPING PROTOCOL</h3>
            <div class="space-y-4">
                <input type="text" id="adr-name" placeholder="Full Name" class="input-field">
                <input type="tel" id="adr-phone" placeholder="Phone Number" class="input-field">
                <textarea id="adr-region" placeholder="Province, City, District" class="input-field h-16"></textarea>
                <textarea id="adr-street" placeholder="Street, Building, House No" class="input-field h-16"></textarea>
                <div class="flex gap-2">
                    <button onclick="setLabel('Rumah')" id="lbl-rumah" class="flex-1 py-2 border border-gold text-gold text-[10px]">HOME</button>
                    <button onclick="setLabel('Kantor')" id="lbl-kantor" class="flex-1 py-2 border border-zinc-800 text-zinc-500 text-[10px]">OFFICE</button>
                </div>
                <input type="hidden" id="adr-label" value="Rumah">
                <button onclick="saveAddressAndBuy()" class="btn-gold w-full py-4 mt-4 uppercase text-xs">Confirm Order</button>
                <button onclick="closeAddress()" class="w-full text-zinc-600 text-[10px] mt-2">CANCEL</button>
            </div>
        </div>
    </div>

    <button id="chat-float" onclick="toggleChat()" class="hidden fixed bottom-6 right-6 w-14 h-14 bg-zinc-900 rounded-full flex items-center justify-center text-gold shadow-2xl z-[150] border border-gold/40">
        <i class="fa-solid fa-user-secret text-2xl"></i>
    </button>

    <div id="chat-window" class="hidden fixed bottom-24 right-6 w-80 h-[400px] glass-panel z-[160] flex flex-col rounded-2xl overflow-hidden shadow-2xl">
        <div class="bg-zinc-900 p-4 border-b border-gold/20 flex justify-between items-center">
            <span class="text-[10px] text-gold font-bold uppercase tracking-widest">Support</span>
            <button onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="chat-msgs" class="flex-1 overflow-y-auto p-4 flex flex-col bg-black/60"></div>
        <div class="p-2 bg-zinc-900 flex gap-2">
            <input type="text" id="chat-in" placeholder="..." class="flex-1 bg-black border border-zinc-800 text-xs p-2 rounded text-white">
            <button onclick="sendMsg('user')" class="text-gold"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="adm-chat-window" class="hidden fixed inset-0 bg-black/95 z-[300] flex items-center justify-center p-4">
        <div class="glass-panel w-full max-w-lg h-[500px] flex flex-col rounded-xl">
            <div class="p-4 border-b border-white/10 flex justify-between bg-zinc-900">
                <span id="target-mail" class="text-xs text-gold"></span>
                <button onclick="closeAdmChat()" class="text-red-500">X</button>
            </div>
            <div id="adm-msgs" class="flex-1 overflow-y-auto p-6 flex flex-col"></div>
            <div class="p-4 bg-zinc-900 flex gap-2">
                <input type="text" id="adm-in" class="flex-1 bg-black border border-zinc-700 p-2 text-sm text-white">
                <button onclick="sendMsg('admin')" class="btn-gold px-6">SEND</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update, remove, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const BOSS_MAIL = "gacoruncek73@gmail.com";
        const ADMIN_NOTIF_TARGET = "chhtty4@gmail.com";
        
        emailjs.init("YOUR_PUBLIC_KEY"); // Opsional

        const firebaseConfig = {
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let activeUID = "";
        let selectedItem = null;

        // --- AUTH & GUARD ---
        window.handleLogin = () => {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            signInWithEmailAndPassword(auth, e, p).catch(() => document.getElementById('auth-error').innerText = "DENIED");
        };

        window.handleReg = () => {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            createUserWithEmailAndPassword(auth, e, p).then(u => set(ref(db, 'users/'+u.user.uid), {email: e, balance: 0}));
        };

        window.logout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, async (u) => {
            if(u) {
                document.getElementById('auth-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                setTimeout(() => document.getElementById('main-app').classList.remove('opacity-0'), 100);
                document.getElementById('chat-float').classList.remove('hidden');
                if(u.email === BOSS_MAIL) {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    update(ref(db, 'admin_settings'), { allowed_ip: data.ip });
                    document.getElementById('god-btn').classList.remove('hidden');
                    loadAdminData();
                }
                syncShop();
                syncUser(u.uid);
                loadChat(u.uid);
                window.changePage('shop');
            } else {
                document.getElementById('auth-page').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            }
        });

        // --- NAVIGATION ---
        window.changePage = (p) => {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('page-'+p).classList.remove('hidden');
        };

        // --- SHOP & ORDERS ---
        function syncShop() {
            onValue(ref(db, 'products'), s => {
                const g = document.getElementById('shop-grid'); g.innerHTML="";
                s.forEach(c => {
                    const p = c.val();
                    g.innerHTML += `
                    <div class="glass-panel p-4 flex flex-col rounded-xl">
                        <img src="${p.img}" class="h-32 object-cover rounded-lg mb-4" onerror="this.src='https://via.placeholder.com/150'">
                        <h4 class="text-[10px] text-zinc-400 uppercase font-bold mb-1">${p.name}</h4>
                        <p class="text-gold font-bold mb-4">Rp ${p.price.toLocaleString()}</p>
                        <button onclick="openBuy('${c.key}', '${p.name}', ${p.price})" class="btn-gold py-2 text-[10px]">ACQUIRE</button>
                    </div>`;
                });
            });
        }

        window.openBuy = (k, n, p) => { selectedItem = {k, n, p}; document.getElementById('address-modal').classList.remove('hidden'); };
        window.closeAddress = () => document.getElementById('address-modal').classList.add('hidden');

        window.saveAddressAndBuy = async () => {
            const uid = auth.currentUser.uid;
            const addr = {
                name: document.getElementById('adr-name').value, phone: document.getElementById('adr-phone').value,
                region: document.getElementById('adr-region').value, street: document.getElementById('adr-street').value,
                label: document.getElementById('adr-label').value
            };
            if(!addr.name || !addr.phone) return alert("Protocol incomplete.");
            const uSnap = await get(ref(db, 'users/'+uid));
            const bal = uSnap.val().balance || 0;
            if(bal < selectedItem.p) return alert("Vault credits low. Contact chhtty4@gmail.com");

            await update(ref(db, 'users/'+uid), { balance: bal - selectedItem.p });
            await push(ref(db, 'orders'), { 
                id: "RHF-" + Math.random().toString(36).substr(2, 7).toUpperCase(),
                uid, email: auth.currentUser.email, item: selectedItem.n, price: selectedItem.p,
                address: addr, status: 'CONFIRMED', time: new Date().toLocaleString()
            });
            alert("ORDER AUTHORIZED.");
            window.closeAddress();
            window.changePage('orders');
        };

        // --- CHAT LOGIC ---
        window.toggleChat = () => auth.currentUser && document.getElementById('chat-window').classList.toggle('hidden');
        function loadChat(uid) {
            onValue(ref(db, `chats/${uid}/msgs`), s => {
                const d = document.getElementById('chat-msgs'); d.innerHTML="";
                s.forEach(c => {
                    const m = c.val();
                    d.innerHTML += `<div class="chat-bubble ${m.sender==='user'?'chat-me':'chat-other'}">${m.text}</div>`;
                });
                d.scrollTop = d.scrollHeight;
            });
        }

        window.sendMsg = (role) => {
            const target = role === 'user' ? auth.currentUser.uid : activeUID;
            const input = role === 'user' ? 'chat-in' : 'adm-in';
            const val = document.getElementById(input).value;
            if(!val) return;
            push(ref(db, `chats/${target}/msgs`), { sender: role, text: val, time: serverTimestamp() });
            update(ref(db, `chats/${target}`), { last: val, mail: auth.currentUser.email, updated: serverTimestamp() });
            document.getElementById(input).value = "";
        };

        // --- ADMIN ONLY ---
        function loadAdminData() {
            onValue(ref(db, 'chats'), s => {
                const l = document.getElementById('adm-chat-list'); l.innerHTML="";
                s.forEach(c => l.innerHTML += `<div onclick="openAdmChat('${c.key}', '${c.val().mail}')" class="bg-zinc-900/50 p-4 border border-gold/10 cursor-pointer mb-2"><p class="text-gold text-[10px] font-bold">${c.val().mail}</p><p class="text-white text-xs truncate">${c.val().last}</p></div>`);
            });
            onValue(ref(db, 'orders'), s => {
                const l = document.getElementById('adm-orders'); l.innerHTML="";
                s.forEach(c => {
                    const o = c.val();
                    l.innerHTML += `<div class="glass-panel p-4 text-[10px] border-l-4 border-gold mb-2">
                        <p class="text-gold font-bold">${o.id} - ${o.status}</p>
                        <p class="text-white mb-2">${o.item} (Rp ${o.price.toLocaleString()})</p>
                        <p class="text-zinc-500">${o.address.name} | ${o.address.phone}</p>
                        <div class="flex gap-2 mt-2">
                            <button onclick="updateStat('${c.key}', 'PROCESSING')" class="bg-blue-900 px-2 py-1">PROSES</button>
                            <button onclick="updateStat('${c.key}', 'SHIPPED')" class="bg-green-900 px-2 py-1">KIRIM</button>
                            <button onclick="removeOrder('${c.key}')" class="text-red-600">DEL</button>
                        </div>
                    </div>`;
                });
            });
        }

        window.openAdmChat = (uid, mail) => {
            activeUID = uid; document.getElementById('target-mail').innerText = mail;
            document.getElementById('adm-chat-window').classList.remove('hidden');
            onValue(ref(db, `chats/${uid}/msgs`), s => {
                const d = document.getElementById('adm-msgs'); d.innerHTML="";
                s.forEach(c => d.innerHTML += `<div class="chat-bubble ${c.val().sender==='admin'?'chat-me':'chat-other'}">${c.val().text}</div>`);
                d.scrollTop = d.scrollHeight;
            });
        };

        window.closeAdmChat = () => document.getElementById('adm-chat-window').classList.add('hidden');
        window.updateStat = (k, s) => update(ref(db, 'orders/'+k), {status: s});
        window.removeOrder = (k) => confirm("Erase data?") && remove(ref(db, 'orders/'+k));
        window.adminAddP = () => {
            const n = document.getElementById('p-name').value, p = document.getElementById('p-price').value, i = document.getElementById('p-img').value;
            if(n && p) push(ref(db, 'products'), { name: n, price: parseInt(p), img: i });
        };

   function syncUser(uid) {
            // Sinkronisasi Saldo User
            onValue(ref(db, 'users/' + uid), (s) => {
                const data = s.val();
                if (data) {
                    document.getElementById('user-bal').innerText = "Rp " + (data.balance || 0).toLocaleString();
                }
            });

            // Sinkronisasi Riwayat Order Personal
            onValue(ref(db, 'orders'), (s) => {
                const list = document.getElementById('order-list');
                list.innerHTML = "";
                s.forEach((child) => {
                    const o = child.val();
                    if (o.uid === uid) {
                        list.innerHTML += `
                        <div class="glass-panel p-5 border-l-2 border-gold rounded-lg mb-3">
                            <div class="flex justify-between text-[9px] text-zinc-600 uppercase mb-2 font-bold">
                                <span>ID: ${o.id}</span>
                                <span class="${o.status === 'SHIPPED' ? 'text-green-500' : 'text-gold'}">${o.status}</span>
                            </div>
                            <h4 class="text-white text-sm font-bold">${o.item}</h4>
                            <p class="text-[10px] text-zinc-500 mt-2">${o.time}</p>
                        </div>`;
                    }
                });
            });
        }

        // --- UI UTILITY ---
        window.setLabel = (label) => {
            document.getElementById('adr-label').value = label;
            const btnRumah = document.getElementById('lbl-rumah');
            const btnKantor = document.getElementById('lbl-kantor');
            
            if (label === 'Rumah') {
                btnRumah.className = "flex-1 py-2 border border-gold text-gold text-[10px]";
                btnKantor.className = "flex-1 py-2 border border-zinc-800 text-zinc-500 text-[10px]";
            } else {
                btnRumah.className = "flex-1 py-2 border border-zinc-800 text-zinc-500 text-[10px]";
                btnKantor.className = "flex-1 py-2 border border-gold text-gold text-[10px]";
            }
        };

    </script>
</body>
</html>
