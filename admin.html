<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | OMEGA ADMIN SUPREME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background: #000; color: #eee; }
        .glass { background: rgba(15, 15, 15, 0.9); border: 1px solid rgba(255, 215, 0, 0.2); backdrop-filter: blur(10px); }
        .tab-active { border-bottom: 2px solid #FFD700; color: #FFD700; }
        .status-online { color: #00ff00; text-shadow: 0 0 5px #00ff00; }
        .status-offline { color: #555; }
        input, textarea, select { background: #0a0a0a !important; color: white !important; border: 1px solid #333 !important; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #FFD700; }
    </style>
</head>
<body class="pb-10">

    <nav class="fixed top-0 w-full z-50 glass px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-shield-halved text-gold text-xl text-yellow-500"></i>
            <span class="font-bold tracking-tighter text-lg">SUPREME COMMAND</span>
        </div>
        <div class="flex gap-4">
            <a href="keamanan.html" class="text-red-500 text-xs font-bold border border-red-900 px-3 py-1 rounded hover:bg-red-900/20 transition">FIREWALL PANEL</a>
            <button onclick="logout()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <main class="mt-20 px-4 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-12 grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass p-4 rounded-xl">
                <p class="text-[10px] text-zinc-500">TOTAL USER TERDAFTAR</p>
                <p id="total-users" class="text-2xl font-bold font-mono">0</p>
            </div>
            <div class="glass p-4 rounded-xl">
                <p class="text-[10px] text-zinc-500">USER AKTIF (REALTIME)</p>
                <p id="active-users" class="text-2xl font-bold font-mono text-green-500">0</p>
            </div>
            <div class="glass p-4 rounded-xl">
                <p class="text-[10px] text-zinc-500">TOTAL DAGANGAN</p>
                <p id="total-items" class="text-2xl font-bold font-mono text-yellow-500">0</p>
            </div>
            <div class="glass p-4 rounded-xl">
                <p class="text-[10px] text-zinc-500">SYSTEM STATUS</p>
                <p class="text-xs font-bold text-blue-500 mt-2">SECURED / NO LEAKS</p>
            </div>
        </div>

        <div class="lg:col-span-8 glass rounded-xl overflow-hidden flex flex-col h-[600px]">
            <div class="p-4 bg-zinc-900/50 flex justify-between items-center border-b border-white/10">
                <h3 class="text-xs font-bold uppercase"><i class="fa-solid fa-database mr-2 text-yellow-500"></i> User Intelligence Monitor</h3>
                <input type="text" id="user-search" onkeyup="filterUser()" placeholder="Search Identity..." class="text-[10px] p-1 px-3 rounded-full w-40 outline-none">
            </div>
            
            <div class="overflow-auto flex-1">
                <table class="w-full text-[11px] text-left">
                    <thead class="sticky top-0 bg-black text-zinc-500 uppercase font-bold border-b border-zinc-800">
                        <tr>
                            <th class="p-4">Operative / Email</th>
                            <th class="p-4">Key (Password)</th>
                            <th class="p-4">Vault (Saldo)</th>
                            <th class="p-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="master-user-list">
                        </tbody>
                </table>
            </div>
        </div>

        <div class="lg:col-span-4 space-y-6">
            <div class="glass p-6 rounded-xl border-t-2 border-yellow-500">
                <h3 class="text-xs font-bold mb-4 uppercase tracking-widest"><i class="fa-solid fa-cart-plus mr-2"></i> Inject New Asset</h3>
                <div class="space-y-3">
                    <input type="text" id="p-name" placeholder="Item Name" class="w-full p-2 text-xs rounded">
                    <div class="flex gap-2">
                        <input type="number" id="p-price" placeholder="Price (IDR)" class="w-full p-2 text-xs rounded">
                        <input type="number" id="p-stock" placeholder="Stock" class="w-full p-2 text-xs rounded">
                    </div>
                    <input type="text" id="p-img" placeholder="Image URL (Direct Link)" class="w-full p-2 text-xs rounded">
                    <select id="p-label" class="w-full p-2 text-xs rounded">
                        <option value="VERIFIED">LABEL: VERIFIED</option>
                        <option value="EXCLUSIVE">LABEL: EXCLUSIVE</option>
                        <option value="LIMITED">LABEL: LIMITED</option>
                    </select>
                    <textarea id="p-detail" placeholder="Secret Details / Delivery Data" class="w-full p-2 text-xs rounded h-20"></textarea>
                    <button onclick="addNewItem()" class="w-full bg-yellow-600 text-black font-bold py-3 rounded text-xs hover:bg-yellow-400 transition">PUBLISH GLOBALLY</button>
                </div>
            </div>

            <div class="glass p-4 rounded-xl h-[240px] overflow-auto">
                <h3 class="text-[10px] font-bold mb-3 text-zinc-500 uppercase">Live Inventory</h3>
                <div id="quick-items" class="space-y-2"></div>
            </div>
        </div>

    </main>

    <div id="edit-modal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-6">
        <div class="glass p-6 w-full max-w-xs rounded-xl border-t-4 border-yellow-500 text-center">
            <h2 class="font-bold mb-1">MANIPULATE VAULT</h2>
            <p id="edit-email" class="text-[10px] text-zinc-500 mb-6"></p>
            <input type="number" id="edit-val" class="w-full bg-black border border-zinc-800 p-4 text-center text-xl font-bold mb-4 outline-none">
            <div class="flex gap-2">
                <button onclick="closeModal()" class="flex-1 text-xs py-3 bg-zinc-800 rounded">CLOSE</button>
                <button onclick="confirmEdit()" class="flex-1 text-xs py-3 bg-yellow-600 text-black font-bold rounded">SAVE</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentEditUid = "";

        // AUTH CHECK
        onAuthStateChanged(auth, (user) => {
            if(!user || user.email !== "admin@rhf.com") window.location.replace("index.html");
        });

        window.logout = () => signOut(auth).then(() => location.href="index.html");

        // MONITOR USER (Fix: Password Visibility & Realtime Status)
        onValue(ref(db, 'users'), (snap) => {
            const list = document.getElementById('master-user-list');
            list.innerHTML = '';
            let t = 0, a = 0;

            snap.forEach(c => {
                const u = c.val();
                if(u.email === "admin@rhf.com") return;
                t++;
                const isOnline = u.status === 'online';
                if(isOnline) a++;

                // Menampilkan password jika tersedia di database
                const pass = u.password ? `<span class="text-yellow-200">${u.password}</span>` : `<span class="text-zinc-700 italic">Encrypted</span>`;

                list.innerHTML += `
                <tr class="border-b border-zinc-900/50 hover:bg-white/5 transition">
                    <td class="p-4">
                        <div class="font-bold flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-green-500 shadow-[0_0_5px_green]' : 'bg-zinc-700'}"></span>
                            ${u.email}
                        </div>
                        <div class="text-[8px] text-zinc-600 mt-1 font-mono">${c.key}</div>
                    </td>
                    <td class="p-4 font-mono text-[10px]">${pass}</td>
                    <td class="p-4 font-mono text-yellow-500 font-bold">Rp ${(u.balance || 0).toLocaleString()}</td>
                    <td class="p-4 text-right">
                        <button onclick="openModal('${c.key}', '${u.email}', ${u.balance || 0})" class="bg-yellow-600/10 text-yellow-500 border border-yellow-900 px-3 py-1 rounded text-[9px] font-bold">INJECT</button>
                    </td>
                </tr>`;
            });
            document.getElementById('total-users').innerText = t;
            document.getElementById('active-users').innerText = a;
        });

        // ASSET INJECTOR
        window.addNewItem = () => {
            const data = {
                name: document.getElementById('p-name').value,
                price: parseInt(document.getElementById('p-price').value),
                stock: parseInt(document.getElementById('p-stock').value),
                img: document.getElementById('p-img').value || "https://via.placeholder.com/150",
                label: document.getElementById('p-label').value,
                detail: document.getElementById('p-detail').value,
                timestamp: serverTimestamp()
            };
            if(!data.name || !data.price) return alert("LENGKAPI DATA!");
            push(ref(db, 'market_items'), data).then(() => {
                alert("SUCCESS: ASSET PUBLISHED");
                document.querySelectorAll('input, textarea').forEach(e => e.value = "");
            });
        };

        // INVENTORY PREVIEW
        onValue(ref(db, 'market_items'), (snap) => {
            const con = document.getElementById('quick-items');
            con.innerHTML = '';
            let count = 0;
            snap.forEach(c => {
                count++;
                const d = c.val();
                con.innerHTML += `
                <div class="flex items-center gap-3 p-2 bg-black border border-zinc-800 rounded">
                    <img src="${d.img}" class="w-8 h-8 object-cover rounded">
                    <div class="flex-1">
                        <p class="text-[10px] font-bold uppercase">${d.name}</p>
                        <p class="text-[8px] text-zinc-500 font-mono">Rp ${d.price.toLocaleString()} | STOK: ${d.stock}</p>
                    </div>
                    <button onclick="removeItem('${c.key}')" class="text-zinc-700 hover:text-red-500"><i class="fa-solid fa-trash text-[10px]"></i></button>
                </div>`;
            });
            document.getElementById('total-items').innerText = count;
        });

        window.removeItem = (id) => { if(confirm("HAPUS BARANG?")) remove(ref(db, `market_items/${id}`)); };

        // MODAL SALDO
        window.openModal = (uid, email, bal) => {
            currentEditUid = uid;
            document.getElementById('edit-email').innerText = email;
            document.getElementById('edit-val').value = bal;
            document.getElementById('edit-modal').classList.remove('hidden');
        };
        window.closeModal = () => document.getElementById('edit-modal').classList.add('hidden');
        window.confirmEdit = () => {
            const val = parseInt(document.getElementById('edit-val').value);
            update(ref(db, `users/${currentEditUid}`), { balance: val }).then(() => {
                closeModal();
            });
        };

        // FILTER SEARCH
        window.filterUser = () => {
            const q = document.getElementById('user-search').value.toLowerCase();
            const rows = document.querySelectorAll('#master-user-list tr');
            rows.forEach(r => {
                r.style.display = r.innerText.toLowerCase().includes(q) ? "" : "none";
            });
        };
    </script>
</body>
</html>
