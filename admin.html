<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | GOD MODE ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background: #050505; color: #e5e5e5; }
        .glass { background: rgba(20, 20, 20, 0.9); border: 1px solid rgba(255, 215, 0, 0.1); backdrop-filter: blur(10px); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input, select { background: #0a0a0a !important; border: 1px solid #333 !important; color: white !important; outline: none; transition: 0.3s; }
        input:focus { border-color: #FFD700 !important; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        
        /* Scrollbar Keren */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #FFD700; }
    </style>
</head>
<body class="pb-20">

    <nav class="sticky top-0 z-50 glass border-b border-yellow-500/20 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-crown text-yellow-500 text-2xl animate-pulse"></i>
            <div>
                <h1 class="font-bold text-xl tracking-widest text-white leading-none">GOD MODE</h1>
                <p class="text-[10px] text-zinc-500 font-mono">ROOT ACCESS GRANTED</p>
            </div>
        </div>
        <button onclick="logout()" class="bg-red-900/20 hover:bg-red-600 text-red-500 hover:text-white px-4 py-2 rounded border border-red-900 transition text-xs font-bold uppercase">
            Terminate Session
        </button>
    </nav>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="lg:col-span-1 space-y-6">
            <div class="glass p-6 rounded-2xl border-l-4 border-green-500">
                <h2 class="text-sm font-bold text-green-500 uppercase mb-4 tracking-widest"><i class="fa-solid fa-user-plus mr-2"></i> Create New Operative</h2>
                <div class="space-y-3">
                    <div>
                        <label class="text-[10px] text-zinc-500 uppercase font-bold">Email Address</label>
                        <input type="email" id="new-email" class="w-full p-3 rounded text-sm" placeholder="agent@rhf.com">
                    </div>
                    <div>
                        <label class="text-[10px] text-zinc-500 uppercase font-bold">Password (Database)</label>
                        <input type="text" id="new-pass" class="w-full p-3 rounded text-sm font-mono text-yellow-500" placeholder="Secret123">
                    </div>
                    <div>
                        <label class="text-[10px] text-zinc-500 uppercase font-bold">IP Address (Whitelist)</label>
                        <div class="flex gap-2">
                            <input type="text" id="new-ip" class="w-full p-3 rounded text-sm font-mono" placeholder="192.168.x.x">
                            <button onclick="pasteIP()" class="bg-zinc-800 px-3 rounded text-xs"><i class="fa-solid fa-paste"></i></button>
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] text-zinc-500 uppercase font-bold">Initial Balance</label>
                        <input type="number" id="new-balance" class="w-full p-3 rounded text-sm" value="0">
                    </div>
                    <button onclick="createNewUser()" class="w-full py-4 bg-green-600 hover:bg-green-500 text-black font-bold uppercase rounded transition tracking-widest mt-2">
                        Deploy & Whitelist
                    </button>
                </div>
            </div>

            <div class="glass p-6 rounded-2xl border-l-4 border-blue-500">
                <h2 class="text-sm font-bold text-blue-500 uppercase mb-4 tracking-widest"><i class="fa-solid fa-chart-line mr-2"></i> Network Status</h2>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-black/50 p-3 rounded border border-white/5">
                        <p class="text-[10px] text-zinc-500">TOTAL USERS</p>
                        <p id="stat-users" class="text-2xl font-mono font-bold text-white">0</p>
                    </div>
                    <div class="bg-black/50 p-3 rounded border border-white/5">
                        <p class="text-[10px] text-zinc-500">TOTAL CIRCULATION</p>
                        <p id="stat-money" class="text-xl font-mono font-bold text-yellow-500">Rp 0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="glass rounded-2xl border-t-4 border-yellow-500 overflow-hidden h-full flex flex-col">
                <div class="p-5 bg-zinc-900/80 flex justify-between items-center border-b border-white/5">
                    <h2 class="text-sm font-bold text-yellow-500 uppercase tracking-widest"><i class="fa-solid fa-users-viewfinder mr-2"></i> Active Operatives</h2>
                    <input type="text" id="search-db" onkeyup="filterTable()" placeholder="Search Identity..." class="bg-black text-xs px-4 py-2 rounded-full w-48 border border-zinc-700">
                </div>
                
                <div class="overflow-auto flex-1 h-[600px]">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-black text-[10px] text-zinc-500 uppercase tracking-wider font-bold z-10">
                            <tr>
                                <th class="p-4 border-b border-zinc-800">Identity (Email/UID)</th>
                                <th class="p-4 border-b border-zinc-800 text-red-500">Decrypted Pass</th>
                                <th class="p-4 border-b border-zinc-800">IP Origin</th>
                                <th class="p-4 border-b border-zinc-800 text-right">Vault (Saldo)</th>
                                <th class="p-4 border-b border-zinc-800 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="user-table-body" class="text-xs font-mono divide-y divide-zinc-900">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <div id="toast" class="fixed bottom-5 right-5 bg-yellow-500 text-black px-6 py-4 rounded font-bold translate-y-20 opacity-0 transition-all duration-300 z-50">
        Action Executed.
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 1. MONITOR USER DATABASE (REALTIME)
        onValue(ref(db, 'users'), (snapshot) => {
            const table = document.getElementById('user-table-body');
            table.innerHTML = '';
            let totalUsers = 0;
            let totalMoney = 0;

            snapshot.forEach((child) => {
                const u = child.val();
                const uid = child.key;

                // Jangan tampilkan admin di list ini
                if (u.email === "admin@rhf.com") return;

                totalUsers++;
                totalMoney += (u.balance || 0);

                const row = `
                <tr class="hover:bg-white/5 transition group">
                    <td class="p-4">
                        <div class="font-bold text-white mb-1">${u.email}</div>
                        <div class="text-[9px] text-zinc-600 truncate w-24">${uid}</div>
                    </td>
                    <td class="p-4 text-red-400 font-bold bg-red-900/10 border-l border-red-900/20">
                        ${u.password || '---'}
                    </td>
                    <td class="p-4 text-zinc-400">
                        ${u.ip_address || '<span class="text-zinc-700">Unknown</span>'}
                    </td>
                    <td class="p-4 text-right text-yellow-500 font-bold">
                        Rp ${(u.balance || 0).toLocaleString()}
                    </td>
                    <td class="p-4 text-center">
                        <button onclick="deleteUser('${uid}')" class="text-zinc-600 hover:text-red-500 transition px-2"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
                `;
                table.innerHTML += row;
            });

            document.getElementById('stat-users').innerText = totalUsers;
            document.getElementById('stat-money').innerText = "Rp " + totalMoney.toLocaleString();
        });

        // 2. FUNGSI CREATE USER BARU + WHITELIST IP
        window.createNewUser = async () => {
            const email = document.getElementById('new-email').value;
            const pass = document.getElementById('new-pass').value;
            const ip = document.getElementById('new-ip').value;
            const bal = parseInt(document.getElementById('new-balance').value);

            if(!email || !pass || !ip) return alert("DATA TIDAK LENGKAP!");

            try {
                // A. Simpan data ke Database 'users' (Manual, karena kita admin)
                // Kita gunakan Timestamp sebagai Fake UID agar tidak logout admin
                const fakeUid = "user_" + Date.now();
                
                await set(ref(db, `users/${fakeUid}`), {
                    email: email,
                    password: pass,
                    balance: bal,
                    ip_address: ip,
                    role: 'buyer',
                    created_at: new Date().toISOString()
                });

                // B. Masukkan IP ke Whitelist (admin_settings/whitelisted_ips)
                // Kita ganti struktur lama (string) jadi list (array/object)
                await push(ref(db, `admin_settings/whitelisted_ips`), ip);

                showToast("OPERATIVE DEPLOYED & IP WHITELISTED");
                
                // Reset Form
                document.getElementById('new-email').value = "";
                document.getElementById('new-pass').value = "";
                document.getElementById('new-ip').value = "";
            } catch (error) {
                alert("GAGAL: " + error.message);
            }
        };

        // 3. FITUR HAPUS USER
        window.deleteUser = (uid) => {
            if(confirm("PERINGATAN: Menghapus user ini akan permanen. Lanjutkan?")) {
                remove(ref(db, `users/${uid}`));
                showToast("USER ELIMINATED");
            }
        };

        // 4. UTILS
        window.pasteIP = async () => {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('new-ip').value = text;
            } catch (e) { alert("Izin clipboard ditolak browser"); }
        };

        window.filterTable = () => {
            const term = document.getElementById('search-db').value.toLowerCase();
            const rows = document.querySelectorAll('#user-table-body tr');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        };

        window.logout = () => signOut(auth).then(() => location.href = "index.html");

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
