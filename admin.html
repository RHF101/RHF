<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RHF | GOD MODE ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#FFD700', dark: '#050505', glass: 'rgba(20, 20, 20, 0.95)' },
                    fontFamily: { mono: ['JetBrains Mono', 'monospace'], sans: ['Rajdhani', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background: #000; color: #ccc; overflow-x: hidden; }
        .glass-panel { background: var(--glass); border: 1px solid rgba(255, 215, 0, 0.15); backdrop-filter: blur(20px); box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .input-god { background: #0a0a0a; border: 1px solid #333; color: white; padding: 12px; font-size: 13px; width: 100%; outline: none; transition: 0.3s; }
        .input-god:focus { border-color: #FFD700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.2); }
        .btn-action { transition: 0.2s; cursor: pointer; }
        .btn-action:active { transform: scale(0.95); }
        
        /* Scrollbar Keren */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: black; }

        /* Animasi Status */
        .status-dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; }
        .online { background-color: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .offline { background-color: #555; }
    </style>
</head>
<body class="font-sans antialiased pb-20">

    <nav class="fixed top-0 w-full z-50 glass-panel border-b border-gold/30 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-dragon text-gold text-2xl"></i>
            <div>
                <h1 class="text-gold font-bold text-xl tracking-tighter leading-none">GOD MODE</h1>
                <p class="text-[9px] text-zinc-500 font-mono tracking-widest">DATABASE: <span class="text-green-500">CONNECTED</span></p>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="toggleView('users')" class="md:hidden text-gold"><i class="fa-solid fa-users"></i></button>
            <button onclick="toggleView('items')" class="md:hidden text-blue-400"><i class="fa-solid fa-box"></i></button>
            <button onclick="adminLogout()" class="bg-red-900/50 text-red-500 border border-red-800 px-3 py-1 rounded text-xs font-bold hover:bg-red-600 hover:text-white transition">
                LOGOUT
            </button>
        </div>
    </nav>

    <main class="mt-20 px-2 md:px-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <section id="panel-users" class="lg:col-span-7 glass-panel rounded-xl overflow-hidden flex flex-col h-[85vh]">
            <div class="p-4 border-b border-zinc-800 bg-zinc-900/50 flex justify-between items-center">
                <h2 class="text-gold font-bold flex items-center gap-2"><i class="fa-solid fa-user-secret"></i> USER SPY MONITOR</h2>
                <input type="text" id="search-user" onkeyup="searchUser()" placeholder="Cari Email..." class="bg-black border border-zinc-700 text-xs p-2 rounded w-32 focus:w-48 transition-all">
            </div>

            <div class="flex-1 overflow-auto">
                <table class="w-full text-left text-[11px] md:text-xs">
                    <thead class="bg-black text-zinc-500 sticky top-0 uppercase">
                        <tr>
                            <th class="p-3">Identity</th>
                            <th class="p-3">Secret (Pass)</th>
                            <th class="p-3">Vault (Saldo)</th>
                            <th class="p-3 text-right">Control</th>
                        </tr>
                    </thead>
                    <tbody id="user-list" class="divide-y divide-zinc-800/50">
                        </tbody>
                </table>
            </div>
            
            <div class="p-2 bg-black text-[10px] text-center text-zinc-600 font-mono">
                TOTAL USERS: <span id="count-users" class="text-white">0</span> | ACTIVE: <span id="count-active" class="text-green-500">0</span>
            </div>
        </section>

        <section id="panel-items" class="lg:col-span-5 flex flex-col gap-6">
            
            <div class="glass-panel p-5 rounded-xl border-t-4 border-gold">
                <h3 class="text-white font-bold mb-4 text-sm uppercase tracking-widest flex justify-between">
                    <span><i class="fa-solid fa-upload mr-2"></i> INJECT ASSET</span>
                    <button onclick="clearForm()" class="text-[10px] text-zinc-500 hover:text-white">RESET</button>
                </h3>
                
                <div class="space-y-3">
                    <input type="text" id="p-name" placeholder="NAMA BARANG (Ex: Database Nasabah)" class="input-god">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p-price" placeholder="HARGA (IDR)" class="input-god font-mono">
                        <input type="number" id="p-stock" placeholder="STOK (Unit)" class="input-god font-mono">
                    </div>

                    <div class="flex gap-2">
                        <input type="text" id="p-img" onchange="previewImg()" placeholder="URL GAMBAR (https://...)" class="input-god">
                        <img id="img-prev" src="" class="w-10 h-10 object-cover bg-zinc-800 rounded hidden">
                    </div>

                    <select id="p-label" class="input-god bg-black">
                        <option value="VERIFIED">LABEL: VERIFIED (AMAN)</option>
                        <option value="RARE">LABEL: RARE (LANGKA)</option>
                        <option value="ILLEGAL">LABEL: BLACK MARKET</option>
                    </select>

                    <textarea id="p-detail" placeholder="DETAIL RAHASIA (Link Download / Alamat Asli / Spek)" class="input-god h-20"></textarea>

                    <button onclick="uploadItem()" class="w-full bg-gradient-to-r from-yellow-600 to-yellow-400 text-black font-bold py-3 text-sm uppercase hover:brightness-110 shadow-lg shadow-gold/20 btn-action">
                        PUBLISH TO GLOBAL SERVER
                    </button>
                </div>
            </div>

            <div class="glass-panel flex-1 rounded-xl overflow-hidden flex flex-col h-[400px]">
                <div class="p-3 bg-zinc-900/50 border-b border-zinc-800">
                    <h3 class="text-blue-400 font-bold text-xs uppercase"><i class="fa-solid fa-server mr-2"></i> LIVE INVENTORY</h3>
                </div>
                <div class="flex-1 overflow-y-auto p-2 space-y-2" id="item-list">
                    </div>
            </div>

        </section>
    </main>

    <div id="modal-saldo" class="fixed inset-0 z-[100] bg-black/90 hidden flex items-center justify-center p-6">
        <div class="bg-zinc-900 border border-gold p-6 rounded-xl w-full max-w-sm text-center shadow-2xl shadow-gold/20">
            <h3 class="text-gold font-bold text-lg mb-1">MANIPULASI SALDO</h3>
            <p id="target-user-email" class="text-zinc-500 text-xs mb-6 font-mono"></p>
            
            <input type="number" id="new-saldo-val" class="bg-black border border-zinc-700 text-white text-2xl text-center p-3 w-full font-mono mb-4 focus:border-gold outline-none" placeholder="0">
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="closeModal()" class="bg-zinc-800 text-white py-3 rounded font-bold hover:bg-zinc-700">BATAL</button>
                <button onclick="saveSaldo()" class="bg-gold text-black py-3 rounded font-bold hover:bg-yellow-400">SIMPAN</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 bg-zinc-900 border-l-4 border-gold text-white px-6 py-4 rounded shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-[200]">
        <p id="toast-msg" class="font-bold text-sm">System Ready</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, push, update, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG FIREBASE (GANTI DENGAN PUNYA KAMU JIKA BERBEDA)
        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let targetUid = null;

        // 1. CEK LOGIN ADMIN
        onAuthStateChanged(auth, (user) => {
            if(!user || user.email !== "admin@rhf.com") {
                window.location.replace("index.html");
            } else {
                showToast("WELCOME BACK, COMMANDER.");
            }
        });

        window.adminLogout = () => signOut(auth).then(() => location.href = "index.html");

        // 2. FITUR SPY USER (PASSWORD, SALDO, STATUS)
        onValue(ref(db, 'users'), (snapshot) => {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            let total = 0;
            let active = 0;

            snapshot.forEach((child) => {
                const u = child.val();
                if(u.email === "admin@rhf.com") return; // Jangan tampilkan admin sendiri

                total++;
                const isOnline = u.status === 'online'; // Perlu setting di buyer.html
                if(isOnline) active++;

                // LOGIKA PASSWORD (Password akan tampil jika disimpan di DB saat register)
                const passDisplay = u.password ? `<span class="text-red-400 bg-red-900/20 px-1 rounded">${u.password}</span>` : `<span class="text-zinc-700 italic">Encrypted</span>`;

                const row = `
                <tr class="hover:bg-white/5 transition border-b border-zinc-800/50 group">
                    <td class="p-3">
                        <div class="font-bold text-white flex items-center gap-2">
                            <span class="status-dot ${isOnline ? 'online' : 'offline'}"></span>
                            ${u.email}
                        </div>
                        <div class="text-[9px] text-zinc-500 font-mono mt-1">${child.key}</div>
                    </td>
                    <td class="p-3 font-mono text-xs">${passDisplay}</td>
                    <td class="p-3 font-mono text-gold">Rp ${(u.balance || 0).toLocaleString()}</td>
                    <td class="p-3 text-right">
                        <button onclick="openModal('${child.key}', '${u.email}', ${u.balance || 0})" class="bg-blue-600/20 text-blue-400 border border-blue-800 px-2 py-1 rounded text-[9px] font-bold hover:bg-blue-600 hover:text-white mr-1">
                            EDIT SALDO
                        </button>
                        <button onclick="deleteUser('${child.key}')" class="text-zinc-600 hover:text-red-500 p-1"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
                `;
                list.innerHTML += row;
            });
            document.getElementById('count-users').innerText = total;
            document.getElementById('count-active').innerText = active;
        });

        // 3. FITUR UPLOAD BARANG (GLOBAL ACCESS)
        window.uploadItem = () => {
            const item = {
                name: document.getElementById('p-name').value,
                price: parseInt(document.getElementById('p-price').value),
                stock: parseInt(document.getElementById('p-stock').value),
                img: document.getElementById('p-img').value || "https://via.placeholder.com/150",
                label: document.getElementById('p-label').value,
                detail: document.getElementById('p-detail').value,
                timestamp: serverTimestamp()
            };

            if(!item.name || !item.price) return showToast("❌ DATA TIDAK LENGKAP!");

            push(ref(db, 'market_items'), item).then(() => {
                showToast("✅ ASSET BERHASIL DIUPLOAD!");
                window.clearForm();
            });
        };

        // 4. LIST BARANG (REALTIME)
        onValue(ref(db, 'market_items'), (snap) => {
            const box = document.getElementById('item-list');
            box.innerHTML = '';
            snap.forEach(c => {
                const d = c.val();
                box.innerHTML += `
                <div class="flex items-center gap-3 p-3 bg-black border border-zinc-800 rounded hover:border-gold transition group">
                    <img src="${d.img}" class="w-10 h-10 rounded object-cover border border-zinc-700">
                    <div class="flex-1">
                        <h4 class="text-white font-bold text-xs uppercase">${d.name}</h4>
                        <div class="flex gap-2 text-[10px] text-zinc-500 font-mono">
                            <span>STOK: <b class="${d.stock < 5 ? 'text-red-500' : 'text-blue-400'}">${d.stock}</b></span>
                            <span>|</span>
                            <span>IDR ${d.price.toLocaleString()}</span>
                        </div>
                    </div>
                    <button onclick="removeItem('${c.key}')" class="text-zinc-600 hover:text-red-500 text-xs px-2"><i class="fa-solid fa-trash"></i></button>
                </div>
                `;
            });
        });

        // 5. MODAL EDIT SALDO LOGIC
        window.openModal = (uid, email, bal) => {
            targetUid = uid;
            document.getElementById('target-user-email').innerText = email;
            document.getElementById('new-saldo-val').value = bal;
            document.getElementById('modal-saldo').classList.remove('hidden');
        };

        window.closeModal = () => document.getElementById('modal-saldo').classList.add('hidden');

        window.saveSaldo = () => {
            const val = parseInt(document.getElementById('new-saldo-val').value);
            update(ref(db, 'users/' + targetUid), { balance: val }).then(() => {
                showToast("✅ SALDO BERHASIL DIUBAH!");
                closeModal();
            });
        };

        // UTILS
        window.deleteUser = (uid) => {
            if(confirm("HAPUS USER INI? Data akan hilang permanen!")) {
                remove(ref(db, 'users/' + uid));
            }
        };

        window.removeItem = (key) => {
            if(confirm("Hapus barang dagangan ini?")) remove(ref(db, 'market_items/' + key));
        };

        window.clearForm = () => {
            document.querySelectorAll('.input-god').forEach(e => e.value = '');
            document.getElementById('img-prev').classList.add('hidden');
        };

        window.previewImg = () => {
            const url = document.getElementById('p-img').value;
            const img = document.getElementById('img-prev');
            if(url) { img.src = url; img.classList.remove('hidden'); }
        };

        // UI Responsive Toggle
        window.toggleView = (view) => {
            if(view === 'users') {
                document.getElementById('panel-users').classList.remove('hidden');
                document.getElementById('panel-items').classList.add('hidden');
            } else {
                document.getElementById('panel-users').classList.add('hidden');
                document.getElementById('panel-items').classList.remove('hidden');
            }
        }

        // Search Func
        window.searchUser = () => {
            const input = document.getElementById('search-user').value.toLowerCase();
            const rows = document.getElementById('user-list').getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                const txt = rows[i].innerText.toLowerCase();
                rows[i].style.display = txt.includes(input) ? "" : "none";
            }
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 3000);
        }
    </script>
</body>
</html>
