<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>RHF | COMMAND CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --dark: #050505; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--dark); color: #ccc; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass-panel { background: rgba(10, 10, 10, 0.9); border: 1px solid rgba(212, 175, 55, 0.1); }
        .btn-gold { background: linear-gradient(90deg, #b38728, #fcf6ba, #bf953f); color: #000; font-weight: 800; transition: 0.3s; }
        .input-field { background: #000; border: 1px solid #222; color: white; padding: 10px; width: 100%; font-size: 12px; outline: none; }
        .input-field:focus { border-color: var(--gold); }
        .chat-bubble { padding: 8px 12px; border-radius: 10px; font-size: 11px; max-width: 85%; }
        .chat-admin { background: var(--gold); color: black; align-self: flex-end; }
        .chat-user { background: #1a1a1a; color: white; align-self: flex-start; border: 1px solid #333; }
    </style>
</head>
<body class="p-6 md:p-10">

    <nav class="flex justify-between items-center mb-10 border-b border-white/5 pb-6">
        <div>
            <h1 class="font-luxury text-gold text-2xl tracking-tighter">ADMIN PANEL</h1>
            <p class="text-[9px] tracking-[0.5em] text-zinc-600">INVENTORY & COMMUNICATIONS</p>
        </div>
        <div class="flex gap-4">
            <a href="keamanan.html" class="text-[10px] bg-red-900/20 text-red-500 px-4 py-2 border border-red-900/50 hover:bg-red-900 hover:text-white transition">SECURITY CONSOLE</a>
            <button onclick="logout()" class="text-zinc-500 hover:text-red-500"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="glass-panel p-8">
            <h3 class="font-luxury text-gold mb-6 text-xs uppercase tracking-widest"><i class="fa-solid fa-plus-circle mr-2"></i> Inject New Asset</h3>
            <div class="space-y-4">
                <input type="text" id="prod-name" placeholder="NAMA PENERIMA / BARANG" class="input-field">
                <input type="text" id="prod-phone" placeholder="NOMOR TELEPON" class="input-field">
                <input type="number" id="prod-price" placeholder="HARGA (IDR)" class="input-field">
                <select id="prod-cat" class="input-field bg-black text-zinc-400">
                    <option value="Residential">KATEGORI: RUMAH</option>
                    <option value="Corporate">KATEGORI: KANTOR</option>
                </select>
                <textarea id="prod-detail" placeholder="ALAMAT LENGKAP & DETAIL" class="input-field h-32"></textarea>
                <button onclick="uploadAsset()" class="btn-gold w-full py-4 text-[10px] uppercase">Confirm Injection</button>
            </div>
        </div>

        <div class="glass-panel p-6 flex flex-col h-[600px]">
            <h3 class="font-luxury text-zinc-400 mb-6 text-xs uppercase tracking-widest">User Comms</h3>
            <div id="admin-chat-list" class="flex-1 overflow-y-auto space-y-2 pr-2 text-white">
                </div>
        </div>

        <div class="glass-panel p-6 flex flex-col h-[600px] border-l-2 border-l-gold">
            <div id="active-chat-header" class="pb-4 border-b border-white/5 mb-4 font-bold text-gold text-[10px] uppercase tracking-widest">
                Select a conversation
            </div>
            <div id="admin-chat-msgs" class="flex-1 overflow-y-auto flex flex-col gap-3 pr-2 mb-4">
                </div>
            <div id="chat-input-area" class="hidden flex gap-2 pt-4 border-t border-white/5">
                <input type="text" id="admin-chat-in" class="input-field" placeholder="Reply...">
                <button onclick="sendMsg()" class="btn-gold px-6"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, push, onValue, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let activeChatUID = null;

        // PROTEKSI URL
        onAuthStateChanged(auth, (user) => {
            if(!user || user.email !== "admin@rhf.com") window.location.href = "index.html";
        });

        window.logout = () => signOut(auth).then(() => location.href = "index.html");

        // FUNGSI UPLOAD ASSET
        window.uploadAsset = () => {
            const data = {
                name: document.getElementById('prod-name').value,
                phone: document.getElementById('prod-phone').value,
                price: parseInt(document.getElementById('prod-price').value),
                category: document.getElementById('prod-cat').value,
                detail: document.getElementById('prod-detail').value,
                timestamp: serverTimestamp()
            };
            if(!data.name || !data.price) return alert("DATA TIDAK LENGKAP");
            push(ref(db, 'market_items'), data).then(() => {
                alert("ASSET INJECTED!");
                document.querySelectorAll('input, textarea').forEach(i => i.value = "");
            });
        };

        // LOAD LIST CHAT
        onValue(ref(db, 'chats'), (snap) => {
            const list = document.getElementById('admin-chat-list');
            list.innerHTML = '';
            snap.forEach(c => {
                const d = c.val();
                const div = document.createElement('div');
                div.className = "p-3 bg-zinc-900/50 border border-white/5 cursor-pointer hover:bg-gold/10 transition mb-2";
                div.innerHTML = `<p class="font-bold text-gold text-[10px] uppercase">${d.userEmail}</p><p class="text-[9px] text-zinc-500 truncate">${d.lastMessage}</p>`;
                div.onclick = () => openChat(c.key, d.userEmail);
                list.appendChild(div);
            });
        });

        // BUKA CHAT AKTIF
        function openChat(uid, email) {
            activeChatUID = uid;
            document.getElementById('active-chat-header').innerText = "LINE: " + email;
            document.getElementById('chat-input-area').classList.remove('hidden');
            
            onValue(ref(db, `chats/${uid}/messages`), (snap) => {
                const con = document.getElementById('admin-chat-msgs');
                con.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    con.innerHTML += `<div class="chat-bubble ${m.sender === 'admin' ? 'chat-admin' : 'chat-user'}">${m.text}</div>`;
                });
                con.scrollTop = con.scrollHeight;
            });
        }

        // KIRIM PESAN
        window.sendMsg = () => {
            const i = document.getElementById('admin-chat-in');
            if(!i.value || !activeChatUID) return;
            push(ref(db, `chats/${activeChatUID}/messages`), { sender: 'admin', text: i.value, timestamp: serverTimestamp() });
            update(ref(db, `chats/${activeChatUID}`), { lastMessage: i.value, lastSender: 'admin' });
            i.value = '';
        };
    </script>
</body>
</html>
