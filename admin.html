<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | MASTER COMMAND ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background: #000; color: #eee; }
        .glass { background: rgba(10, 10, 10, 0.95); border: 1px solid rgba(255, 215, 0, 0.1); backdrop-filter: blur(20px); }
        input, select, textarea { background: #080808 !important; border: 1px solid #222 !important; color: white !important; outline: none; padding: 10px; border-radius: 8px; }
        input:focus { border-color: #FFD700 !important; }
        #secure-lock { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="pb-10">

    <div id="secure-lock">
        <i class="fa-solid fa-user-shield text-5xl text-yellow-500 mb-4 animate-pulse"></i>
        <p class="font-mono text-[10px] tracking-[0.5em] text-zinc-500 uppercase">Verifying Admin Authority...</p>
    </div>

    <nav class="glass sticky top-0 z-[100] px-6 py-4 flex justify-between items-center border-b border-yellow-500/20">
        <div class="flex items-center gap-3">
            <span class="bg-yellow-500 text-black px-3 py-1 rounded font-black text-sm italic">ADMIN CONTROL</span>
        </div>
        <button onclick="logout()" class="text-red-500 font-bold hover:scale-110 transition"><i class="fa-solid fa-power-off text-xl"></i></button>
    </nav>

    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4">
            <div class="glass p-6 rounded-3xl border-t-2 border-blue-500">
                <h3 class="text-sm font-bold mb-6 text-blue-500 uppercase tracking-widest"><i class="fa-solid fa-plus-circle mr-2"></i> Tambah Barang Juwalan</h3>
                <div class="space-y-4">
                    <input type="text" id="m-name" placeholder="Nama Barang" class="w-full">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="m-price" placeholder="Harga (Rp)" class="w-full">
                        <input type="number" id="m-stock" placeholder="Stok" class="w-full">
                    </div>
                    <input type="text" id="m-img" placeholder="Link Gambar (URL)" class="w-full">
                    <select id="m-label" class="w-full">
                        <option value="NEW">BARANG BARU</option>
                        <option value="HOT">TERLARIS</option>
                        <option value="VVIP">VVIP ITEM</option>
                    </select>
                    <textarea id="m-detail" placeholder="Detail barang..." class="w-full h-20"></textarea>
                    <button onclick="publishAsset()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl uppercase text-xs tracking-widest transition">
                        Kirim ke Buyer.html
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="glass rounded-3xl border-t-2 border-yellow-500 overflow-hidden">
                <div class="p-5 bg-zinc-900/50 flex justify-between items-center">
                    <h3 class="text-xs font-bold uppercase tracking-widest italic text-yellow-500">User Intelligence Database</h3>
                </div>
                <div class="overflow-x-auto h-[500px]">
                    <table class="w-full text-left text-[11px]">
                        <thead class="bg-black text-zinc-500 uppercase">
                            <tr>
                                <th class="p-4">Email / ID</th>
                                <th class="p-4 text-yellow-500">Pass-Key</th>
                                <th class="p-4">Saldo</th>
                                <th class="p-4 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="user-rows" class="divide-y divide-zinc-900">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="vault-modal" class="fixed inset-0 bg-black/95 z-[10000] hidden flex items-center justify-center p-6">
        <div class="glass p-8 w-full max-w-xs rounded-3xl border-t-4 border-yellow-500 text-center">
            <h2 class="font-bold text-lg mb-4 uppercase">Inject Saldo</h2>
            <input type="number" id="new-bal" class="w-full bg-transparent text-center text-3xl font-bold mb-6 text-yellow-500 outline-none">
            <div class="flex gap-2">
                <button onclick="closeVault()" class="flex-1 py-3 bg-zinc-900 rounded-xl text-xs">BATAL</button>
                <button onclick="confirmVault()" class="flex-1 py-3 bg-yellow-600 rounded-xl text-xs text-black font-bold uppercase">Update</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update, push, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let targetUid = "";

        // 1. KEAMANAN: HANYA ADMIN YANG BISA MASUK
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== "admin@rhf.com") {
                window.location.replace("index.html");
            } else {
                document.getElementById('secure-lock').style.display = 'none';
            }
        });

        // 2. AMBIL DATA USER (TERMASUK PASSWORD)
        onValue(ref(db, 'users'), (snap) => {
            const container = document.getElementById('user-rows');
            container.innerHTML = '';
            snap.forEach((child) => {
                const u = child.val();
                if(u.email === "admin@rhf.com") return;
                
                container.innerHTML += `
                <tr class="hover:bg-white/5 border-b border-zinc-900">
                    <td class="p-4">
                        <p class="font-bold text-white">${u.email}</p>
                        <p class="text-[8px] text-zinc-500 font-mono">${child.key}</p>
                    </td>
                    <td class="p-4">
                        <span class="bg-yellow-500/10 text-yellow-500 px-2 py-1 rounded font-mono font-bold border border-yellow-500/20">
                            ${u.password || '---'}
                        </span>
                    </td>
                    <td class="p-4 font-bold text-blue-400 font-mono italic">
                        Rp ${(u.balance || 0).toLocaleString()}
                    </td>
                    <td class="p-4 text-right">
                        <button onclick="openVault('${child.key}', ${u.balance || 0})" class="bg-blue-600/20 text-blue-500 px-3 py-1 rounded text-[10px] border border-blue-900 font-bold hover:bg-blue-600 hover:text-white transition">INJECT</button>
                        <button onclick="deleteUser('${child.key}')" class="text-zinc-700 hover:text-red-500 ml-2"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>`;
            });
        });

        // 3. FUNGSI KIRIM BARANG JUWALAN (FIXED)
        window.publishAsset = () => {
            const data = {
                name: document.getElementById('m-name').value,
                price: parseInt(document.getElementById('m-price').value),
                stock: parseInt(document.getElementById('m-stock').value),
                img: document.getElementById('m-img').value || "https://via.placeholder.com/300",
                label: document.getElementById('m-label').value,
                detail: document.getElementById('m-detail').value,
                timestamp: serverTimestamp()
            };

            if(!data.name || isNaN(data.price)) return alert("Isi data barang dengan lengkap!");

            // KIRIM KE PATH: market_items (Path yang dibaca oleh buyer.html)
            push(ref(db, 'market_items'), data).then(() => {
                alert("BARANG BERHASIL DIKIRIM KE BUYER.HTML!");
                document.querySelectorAll('input, textarea').forEach(e => e.value = "");
            });
        };

        // 4. FUNGSI UPDATE SALDO USER
        window.openVault = (uid, bal) => {
            targetUid = uid;
            document.getElementById('new-bal').value = bal;
            document.getElementById('vault-modal').classList.remove('hidden');
        };
        window.closeVault = () => document.getElementById('vault-modal').classList.add('hidden');
        window.confirmVault = () => {
            const val = parseInt(document.getElementById('new-bal').value);
            update(ref(db, `users/${targetUid}`), { balance: val }).then(() => {
                alert("Saldo Berhasil Diupdate!");
                closeVault();
            });
        };

        window.deleteUser = (id) => { if(confirm("Hapus user ini?")) remove(ref(db, `users/${id}`)); };
        window.logout = () => signOut(auth).then(() => location.href = "index.html");

    </script>
</body>
</html>
