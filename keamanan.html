<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>GHOST PROTOCOL | SECURITY CONSOLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030303; color: #00ff41; font-family: 'JetBrains Mono', monospace; }
        .terminal-border { border: 1px solid #1a331a; background: rgba(0, 20, 0, 0.9); }
        .danger-zone { border: 1px solid #441111; background: rgba(20, 0, 0, 0.9); }
        .input-dark { background: #000; border: 1px solid #00ff41; color: #00ff41; padding: 10px; font-size: 12px; outline: none; }
        .btn-red { background: #660000; color: #fff; border: 1px solid #ff0000; transition: 0.3s; }
        .btn-red:hover { background: #ff0000; box-shadow: 0 0 15px #ff0000; }
        .glow-text { text-shadow: 0 0 5px #00ff41; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="protection-layer" class="fixed inset-0 bg-black z-[999] flex items-center justify-center text-green-500">
        <p class="animate-pulse tracking-[0.5em]">INITIALIZING SECURITY PROTOCOLS...</p>
    </div>

    <div class="flex justify-between items-center mb-8 border-b border-green-900 pb-4">
        <div>
            <h1 class="text-xl font-bold glow-text uppercase tracking-tighter">Ghost Protocol: Situational Awareness</h1>
            <p class="text-[10px] text-green-800">AUTHORIZED PERSONNEL ONLY - NO LOGS POLICY ENABLED</p>
        </div>
        <div class="flex gap-4">
            <button onclick="location.href='admin.html'" class="text-[10px] border border-green-500 px-4 py-1 hover:bg-green-500 hover:text-black transition">BACK TO COMMAND</button>
            <button onclick="logout()" class="text-red-500 text-xs">TERMINATE SESSION</button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="terminal-border p-6 rounded-lg">
            <h2 class="text-sm font-bold mb-6 border-b border-green-900 pb-2 uppercase italic">IP Filter (Firewall)</h2>
            <div class="space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="new-ip" placeholder="Target IP Address" class="input-dark w-full">
                    <button onclick="addIP()" class="bg-green-900 text-black px-4 font-bold hover:bg-green-400">ALLOW</button>
                </div>
                <div id="ip-list" class="mt-6 space-y-2 h-[400px] overflow-y-auto pr-2">
                    </div>
            </div>
        </div>

        <div class="lg:col-span-2 terminal-border p-6 rounded-lg">
            <h2 class="text-sm font-bold mb-6 border-b border-green-900 pb-2 uppercase italic">Active Operatives (User Control)</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-[11px]">
                    <thead class="text-green-800 border-b border-green-900">
                        <tr>
                            <th class="p-2">Identity (Email)</th>
                            <th class="p-2">Vault Balance</th>
                            <th class="p-2">Status</th>
                            <th class="p-2 text-right">Emergency Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-list" class="divide-y divide-green-900/30">
                        </tbody>
                </table>
            </div>
        </div>

    </div>

    <div class="mt-8 danger-zone p-6 rounded-lg border-red-900">
        <h3 class="text-red-500 font-bold mb-4 text-xs">EXTREME MEASURES</h3>
        <div class="flex flex-wrap gap-4">
            <button onclick="killAllUsers()" class="btn-red px-6 py-2 text-[10px] font-bold">BURN ALL SESSIONS (GLOBAL KILL)</button>
            <button onclick="toggleMaintenance()" id="maint-btn" class="border border-yellow-600 text-yellow-600 px-6 py-2 text-[10px] font-bold hover:bg-yellow-600 hover:text-black transition">MAINTENANCE: OFF</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // --- SECURITY LAYER 1: AUTHENTICATION CHECK ---
        onAuthStateChanged(auth, (user) => {
            if(!user || user.email !== "admin@rhf.com") {
                location.replace("https://www.google.com/search?q=404+not+found");
            } else {
                document.getElementById('protection-layer').classList.add('hidden');
            }
        });

        window.logout = () => signOut(auth).then(() => location.href = "index.html");

        // --- FEATURE: IP WHITELIST MANAGEMENT ---
        onValue(ref(db, 'settings/allowed_ips'), (snap) => {
            const list = document.getElementById('ip-list');
            list.innerHTML = '';
            snap.forEach(c => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-black p-2 border border-green-900/40">
                        <span class="text-xs font-bold text-green-400 font-mono">${c.val().ip}</span>
                        <button onclick="removeIP('${c.key}')" class="text-red-800 hover:text-red-500 text-[10px]">REVOKE</button>
                    </div>`;
            });
        });

        window.addIP = () => {
            const ip = document.getElementById('new-ip').value;
            if(!ip) return;
            set(ref(db, 'settings/allowed_ips/' + ip.replace(/\./g, '_')), { ip: ip, timestamp: Date.now() });
            document.getElementById('new-ip').value = '';
        };

        window.removeIP = (key) => remove(ref(db, 'settings/allowed_ips/' + key));

        // --- FEATURE: USER MONITOR & BURN (DETONATOR) ---
        onValue(ref(db, 'users'), (snap) => {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            snap.forEach(c => {
                const u = c.val();
                if(u.email === "admin@rhf.com") return;
                
                const isBurned = u.status === 'burned';
                list.innerHTML += `
                    <tr class="${isBurned ? 'opacity-30 bg-red-900/10' : ''}">
                        <td class="p-2 font-bold">${u.email}</td>
                        <td class="p-2 text-yellow-600 font-mono">Rp ${u.balance || 0}</td>
                        <td class="p-2 text-[9px] uppercase font-bold ${isBurned ? 'text-red-600' : 'text-green-600'}">
                            ${isBurned ? 'TERMINATED' : 'ACTIVE'}
                        </td>
                        <td class="p-2 text-right">
                            <button onclick="burnUser('${c.key}')" class="bg-red-900 text-white px-3 py-1 text-[9px] font-bold hover:bg-red-600">
                                ${isBurned ? 'ALREADY BURNED' : 'BURN IDENTITY'}
                            </button>
                        </td>
                    </tr>`;
            });
        });

        window.burnUser = (uid) => {
            if(confirm("DETONATE USER? This will block their access and clear their session permanently.")) {
                update(ref(db, 'users/' + uid), { 
                    status: 'burned', 
                    balance: 0,
                    last_action: 'TERMINATED BY ADMIN' 
                });
            }
        };

        // --- FEATURE: MAINTENANCE MODE ---
        onValue(ref(db, 'settings/maintenance'), (snap) => {
            const btn = document.getElementById('maint-btn');
            if(snap.val()) {
                btn.innerText = "MAINTENANCE: ON (BLOCKING ACCESS)";
                btn.className = "bg-yellow-600 text-black px-6 py-2 text-[10px] font-bold";
            } else {
                btn.innerText = "MAINTENANCE: OFF (ACCESS OPEN)";
                btn.className = "border border-yellow-600 text-yellow-600 px-6 py-2 text-[10px] font-bold";
            }
        });

        window.toggleMaintenance = () => {
            const btn = document.getElementById('maint-btn');
            const currentState = btn.innerText.includes('OFF');
            set(ref(db, 'settings/maintenance'), currentState);
        };

        // --- FEATURE: KILL ALL USERS ---
        window.killAllUsers = () => {
            if(confirm("DANGER: This will BURN all active users. Are you sure?")) {
                // Logika hapus semua user (perlu iterasi di Firebase)
                alert("PROTOCOL INITIATED: Clearing all unauthorized sessions.");
            }
        };
    </script>
</body>
</html>
