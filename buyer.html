<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | BLACK MARKET INTERFACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background: #000; color: #eee; }
        .glass-nav { background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 215, 0, 0.2); }
        .card-asset { background: #080808; border: 1px solid #1a1a1a; transition: 0.4s; position: relative; overflow: hidden; }
        .card-asset:hover { border-color: #FFD700; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(255, 215, 0, 0.1); }
        .btn-buy { background: linear-gradient(90deg, #b38728, #fcf6ba, #bf953f); color: #000; font-weight: 800; border-radius: 12px; transition: 0.3s; }
        .btn-buy:disabled { background: #222; color: #555; cursor: not-allowed; filter: grayscale(1); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* SECURITY OVERLAY */
        #loading-screen { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="pb-24">

    <div id="loading-screen">
        <div class="w-12 h-12 border-2 border-yellow-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-[10px] font-mono tracking-[0.5em] text-yellow-500 uppercase">Verifying Encrypted Session...</p>
    </div>

    <nav class="sticky top-0 z-[100] glass-nav px-6 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-yellow-500 tracking-tighter italic">RHF NETWORK</h1>
            <div class="flex items-center gap-2 mt-1">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <p id="user-display" class="text-[9px] font-mono text-zinc-500 truncate w-32">---</p>
            </div>
        </div>
        <div class="text-right">
            <p class="text-[9px] text-zinc-500 uppercase font-bold tracking-widest">Your Vault</p>
            <p id="balance-display" class="text-xl font-bold text-blue-400 font-mono italic">Rp 0</p>
        </div>
    </nav>

    <div class="p-6">
        <div class="bg-zinc-900/50 border border-white/5 p-4 rounded-2xl flex justify-between items-center">
            <p class="text-[10px] font-mono text-zinc-500 uppercase">Access Point: <span id="ip-viewer" class="text-yellow-600">Scanning...</span></p>
            <p class="text-[10px] font-mono text-green-500 uppercase">Status: Secure Connection</p>
        </div>
    </div>

    <main class="px-6">
        <h2 class="text-xs font-bold text-zinc-600 uppercase tracking-[0.3em] mb-6 flex items-center gap-3">
            <span class="h-[1px] w-8 bg-zinc-800"></span> Available Assets
        </h2>

        <div id="market-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <div class="fixed bottom-0 w-full glass-nav p-5 flex justify-around items-center border-t border-yellow-500/10">
        <button class="text-yellow-500 text-2xl"><i class="fa-solid fa-ghost"></i></button>
        <button onclick="alert('Chat System Under Maintenance.')" class="text-zinc-600 text-xl"><i class="fa-solid fa-comment-dots"></i></button>
        <button onclick="terminateSession()" class="text-red-900 hover:text-red-500 text-xl transition"><i class="fa-solid fa-power-off"></i></button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let userBalance = 0;
        let userUid = "";

        // 1. KEAMANAN TINGKAT FBI: CEK SESI LOGIN & IP
        async function initSecurity() {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                document.getElementById('ip-viewer').innerText = ipData.ip;
            } catch (e) { document.getElementById('ip-viewer').innerText = "PROTECTED"; }

            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    window.location.replace("index.html");
                } else {
                    userUid = user.uid;
                    document.getElementById('user-display').innerText = user.email;
                    document.getElementById('loading-screen').style.display = 'none';

                    // Ambil Saldo Real-time
                    onValue(ref(db, `users/${user.uid}`), (snap) => {
                        const data = snap.val();
                        userBalance = data?.balance || 0;
                        document.getElementById('balance-display').innerText = "Rp " + userBalance.toLocaleString();
                    });
                }
            });
        }
        initSecurity();

        // 2. LOAD BARANG (SYNC DENGAN ADMIN.HTML)
        onValue(ref(db, 'market_items'), (snap) => {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = '';
            
            if(!snap.exists()) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center text-zinc-700 font-mono text-xs uppercase tracking-widest">No assets available in the current network.</div>`;
                return;
            }

            snap.forEach((child) => {
                const item = child.val();
                const id = child.key;
                const outOfStock = item.stock <= 0;
                const canBuy = userBalance >= item.price;

                grid.innerHTML += `
                <div class="card-asset p-5 rounded-3xl flex flex-col gap-4">
                    <div class="relative overflow-hidden rounded-2xl h-48 bg-zinc-900 border border-white/5">
                        <img src="${item.img}" class="w-full h-full object-cover">
                        <div class="absolute top-3 left-3 bg-black/80 px-3 py-1 rounded-full text-[9px] font-bold text-yellow-500 border border-yellow-500/20 uppercase">
                            ${item.label}
                        </div>
                    </div>
                    
                    <div>
                        <h3 class="text-xl font-bold text-white uppercase truncate">${item.name}</h3>
                        <p class="text-[10px] text-zinc-500 font-mono mt-2 h-10 overflow-hidden leading-relaxed">${item.detail}</p>
                    </div>

                    <div class="flex justify-between items-end mt-auto pt-4 border-t border-white/5">
                        <div>
                            <p class="text-[9px] text-zinc-600 uppercase font-bold">Access Price</p>
                            <p class="text-lg font-bold text-yellow-500 font-mono italic">Rp ${item.price.toLocaleString()}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[9px] text-zinc-600 uppercase font-bold">Stock</p>
                            <p class="text-sm font-bold text-white">${item.stock}</p>
                        </div>
                    </div>

                    <button onclick="executePurchase('${id}', ${item.price}, ${item.stock}, '${item.name}')" 
                        ${(outOfStock || !canBuy) ? 'disabled' : ''}
                        class="btn-buy w-full py-4 text-[10px] uppercase tracking-[0.2em] active:scale-95">
                        ${outOfStock ? 'Sold Out' : (canBuy ? 'Secure Asset' : 'Insufficient Vault')}
                    </button>
                </div>`;
            });
        });

        // 3. FUNGSI TRANSAKSI (SINKRON KE DATABASE)
        window.executePurchase = async (id, price, stock, name) => {
            if(confirm(`AUTORISASI TRANSAKSI: ${name}?`)) {
                try {
                    const newBalance = userBalance - price;
                    const newStock = stock - 1;

                    // Update Saldo & Stok Secara Paralel
                    await update(ref(db, `users/${userUid}`), { balance: newBalance });
                    await update(ref(db, `market_items/${id}`), { stock: newStock });

                    alert("TRANSAKSI SUKSES: Akses Berhasil Diambil.");
                } catch (e) {
                    alert("KEGAGALAN SISTEM: Transaksi Dibatalkan.");
                }
            }
        };

        window.terminateSession = () => {
            if(confirm("LOGOUT DARI JARINGAN?")) {
                signOut(auth).then(() => location.href = "index.html");
            }
        };

    </script>
</body>
</html>
