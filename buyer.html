<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>RHF | EXCLUSIVE MARKETPLACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --dark: #050505; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--dark); color: #ccc; overflow-x: hidden; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass-panel { background: rgba(10, 10, 10, 0.95); border: 1px solid rgba(212, 175, 55, 0.1); }
        .btn-buy { background: var(--gold); color: #000; font-weight: 800; transition: 0.3s; clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%); }
        .btn-buy:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .chat-bubble { padding: 10px 14px; border-radius: 15px; font-size: 12px; max-width: 80%; line-height: 1.4; }
        .chat-user { align-self: flex-end; background: var(--gold); color: black; border-bottom-right-radius: 2px; }
        .chat-admin { align-self: flex-start; background: #1a1a1a; color: white; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="pb-20">

    <nav class="fixed top-0 w-full z-50 glass-panel border-b border-white/5 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
            <span class="font-luxury text-gold tracking-widest text-sm">RHF SYNDICATE</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right border-r border-zinc-800 pr-6">
                <span class="text-[8px] text-zinc-500 uppercase block tracking-widest">Vault Balance</span>
                <span id="user-bal" class="text-gold font-bold font-mono">Rp 0</span>
            </div>
            <button onclick="logout()" class="text-zinc-700 hover:text-red-500 transition"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <main class="pt-32 px-6 max-w-7xl mx-auto">
        <div class="mb-12">
            <h2 class="font-luxury text-3xl text-white mb-2 uppercase">Marketplace Assets</h2>
            <p class="text-[10px] text-zinc-500 tracking-[0.3em] uppercase">Verified Physical & Digital Goods</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="market-items">
            <div class="text-zinc-700 font-mono text-xs">Scanning available assets...</div>
        </div>
    </main>

    <div id="user-chat-window" class="hidden fixed bottom-24 right-6 w-80 h-[450px] glass-panel flex flex-col z-[100] border-t-4 border-t-gold shadow-2xl">
        <div class="p-4 bg-zinc-900/80 font-bold text-[10px] text-gold uppercase tracking-widest border-b border-white/5 flex justify-between items-center">
            <span><i class="fa-solid fa-headset mr-2"></i> Support Line</span>
            <button onclick="toggleChat()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="user-chat-msgs" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 bg-black/20">
            </div>
        <div class="p-3 border-t border-white/5 flex gap-2">
            <input type="text" id="user-chat-in" class="bg-black border border-zinc-800 text-white text-xs p-2 flex-1 outline-none focus:border-gold" placeholder="Type message...">
            <button onclick="sendUserMsg()" class="text-gold px-2 hover:scale-110 transition"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>
    
    <button onclick="toggleChat()" class="fixed bottom-6 right-6 w-14 h-14 bg-gold rounded-full flex items-center justify-center text-black shadow-2xl z-[100] hover:rotate-12 transition">
        <i class="fa-solid fa-comment-dots text-xl"></i>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, push, update, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentUserUID = null;

        // PROTEKSI: Jika belum login, tendang ke index.html
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUID = user.uid;
                // Ambil Data Saldo & Status
                onValue(ref(db, 'users/' + user.uid), (s) => {
                    const d = s.val();
                    if(d.status === 'burned') { 
                        document.body.innerHTML = ""; 
                        location.replace("https://www.google.com"); 
                    }
                    document.getElementById('user-bal').innerText = "Rp " + (d.balance || 0).toLocaleString();
                });
                listenChat(user.uid);
            } else {
                window.location.href = "index.html";
            }
        });

        window.logout = () => signOut(auth).then(() => location.href = "index.html");

        // LOAD BARANG DARI DATABASE
        onValue(ref(db, 'market_items'), (snap) => {
            const con = document.getElementById('market-items');
            con.innerHTML = '';
            snap.forEach(c => {
                const d = c.val();
                con.innerHTML += `
                    <div class="glass-panel p-6 border-l-2 border-l-gold hover:translate-y-[-5px] transition-all duration-300">
                        <div class="flex justify-between items-start mb-4">
                            <span class="text-[8px] bg-gold/10 text-gold px-2 py-1 tracking-widest uppercase border border-gold/20">${d.category}</span>
                            <span class="text-[9px] text-zinc-600 font-mono">#${c.key.substring(1, 6).toUpperCase()}</span>
                        </div>
                        <h3 class="text-white font-bold text-lg uppercase mb-2 tracking-tight">${d.name}</h3>
                        <p class="text-[11px] text-zinc-500 mb-6 leading-relaxed h-12 overflow-hidden">${d.detail}</p>
                        <div class="flex justify-between items-center pt-4 border-t border-white/5">
                            <span class="text-gold font-bold font-mono">Rp ${d.price.toLocaleString()}</span>
                            <button onclick="buyAsset('${c.key}', '${d.name}', ${d.price})" class="btn-buy px-6 py-2 text-[10px] uppercase">Buy Asset</button>
                        </div>
                    </div>`;
            });
        });

        // FUNGSI BELI
        window.buyAsset = async (id, name, price) => {
            const uRef = ref(db, 'users/' + currentUserUID);
            const s = await get(uRef);
            if(s.val().balance < price) return alert("VAULT BALANCE INSUFFICIENT");
            
            if(confirm("Secure this asset? Saldo akan terpotong.")) {
                update(uRef, { balance: s.val().balance - price });
                push(ref(db, `chats/${currentUserUID}/messages`), { 
                    sender: 'admin', 
                    text: `[SYSTEM] Order Confirmed: ${name}. Tunggu instruksi selanjutnya.`, 
                    timestamp: serverTimestamp() 
                });
                alert("ASSET SECURED. CHECK CHAT SUPPORT.");
            }
        };

        // CHAT LOGIC
        window.toggleChat = () => document.getElementById('user-chat-window').classList.toggle('hidden');

        function listenChat(uid) {
            onValue(ref(db, `chats/${uid}/messages`), (snap) => {
                const con = document.getElementById('user-chat-msgs');
                con.innerHTML = '';
                snap.forEach(c => {
                    const m = c.val();
                    con.innerHTML += `<div class="chat-bubble ${m.sender === 'user' ? 'chat-user' : 'chat-admin'}">${m.text}</div>`;
                });
                con.scrollTop = con.scrollHeight;
            });
        }

        window.sendUserMsg = () => {
            const i = document.getElementById('user-chat-in');
            if(!i.value) return;
            push(ref(db, `chats/${currentUserUID}/messages`), { sender: 'user', text: i.value, timestamp: serverTimestamp() });
            update(ref(db, `chats/${currentUserUID}`), { 
                lastMessage: i.value, 
                lastSender: 'user', 
                userEmail: auth.currentUser.email,
                timestamp: serverTimestamp() 
            });
            i.value = '';
        };
    </script>
</body>
</html>
