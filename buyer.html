<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>RHF | EXCLUSIVE MARKETPLACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --dark: #050505; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--dark); color: #ccc; overflow-x: hidden; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .glass-panel { background: rgba(10, 10, 10, 0.95); border: 1px solid rgba(212, 175, 55, 0.1); }
        .btn-buy { background: var(--gold); color: #000; font-weight: 800; transition: 0.3s; clip-path: polygon(10% 0, 100% 0, 100% 70%, 90% 100%, 0 100%, 0 30%); }
        .btn-buy:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .input-address { background: #fff; color: #333; border-bottom: 1px solid #ddd; padding: 12px; width: 100%; font-size: 14px; outline: none; }
        .modal-overlay { background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="pb-20">

    <nav class="fixed top-0 w-full z-50 glass-panel border-b border-white/5 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></div>
            <span class="font-luxury text-gold tracking-widest text-sm">RHF SYNDICATE</span>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right border-r border-zinc-800 pr-6">
                <span class="text-[8px] text-zinc-500 uppercase block tracking-widest">Vault Balance</span>
                <span id="user-bal" class="text-gold font-bold font-mono">Rp 0</span>
            </div>
            <button onclick="logout()" class="text-zinc-700 hover:text-red-500 transition"><i class="fa-solid fa-power-off"></i></button>
        </div>
    </nav>

    <main class="pt-32 px-6 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" id="market-items"></div>
    </main>

    <div id="address-modal" class="hidden fixed inset-0 z-[200] modal-overlay flex items-end md:items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-2xl md:rounded-2xl overflow-hidden shadow-2xl animate-slide-up">
            <div class="p-4 border-b flex items-center gap-4">
                <button onclick="closeAddressModal()" class="text-red-500 text-xl"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 class="text-lg font-bold text-gray-800">Alamat Baru</h2>
            </div>
            
            <div class="p-4 bg-red-50/50 m-4 rounded-lg border border-red-100 flex gap-3">
                <i class="fa-solid fa-file-invoice text-red-400 mt-1"></i>
                <div class="text-xs text-red-800">
                    <p class="font-bold">Tempel dan Isi Otomatis</p>
                    <p>Tempel alamat dari chat di sini untuk mengisi data secara instan.</p>
                </div>
            </div>

            <div class="p-4 space-y-1">
                <p class="text-[10px] font-bold text-gray-400 px-3 uppercase">Informasi Kontak</p>
                <input type="text" id="ship-name" placeholder="Nama Lengkap" class="input-address">
                <input type="text" id="ship-phone" placeholder="Nomor Telepon" class="input-address">
                
                <p class="text-[10px] font-bold text-gray-400 px-3 pt-4 uppercase">Detail Lokasi</p>
                <input type="text" id="ship-area" placeholder="Provinsi, Kota, Kecamatan, Kode Pos" class="input-address">
                <input type="text" id="ship-street" placeholder="Nama Jalan, Gedung, No. Rumah" class="input-address">
                <input type="text" id="ship-detail" placeholder="Detail Lainnya (Cth: Blok / Unit No., Patokan)" class="input-address">
            </div>

            <div class="p-6 bg-gray-50 flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <span class="text-sm text-gray-600">Tandai Sebagai:</span>
                    <div class="flex gap-2">
                        <button onclick="setTag('Kantor')" class="tag-btn border px-4 py-1 rounded text-xs">Kantor</button>
                        <button onclick="setTag('Rumah')" class="tag-btn border px-4 py-1 rounded text-xs bg-red-500 text-white border-red-500">Rumah</button>
                    </div>
                </div>
                <button id="confirm-purchase-btn" class="w-full bg-red-500 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition">Simpan & Beli</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, get, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // CONFIG (Gunakan punya kamu)
        const firebaseConfig = { ... };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let selectedItem = null;
        let currentTag = "Rumah";

        window.buyAsset = (id, name, price) => {
            selectedItem = { id, name, price };
            document.getElementById('address-modal').classList.remove('hidden');
        };

        window.closeAddressModal = () => {
            document.getElementById('address-modal').classList.add('hidden');
        };

        window.setTag = (tag) => {
            currentTag = tag;
            // Update UI tombol tag jika perlu
        };

        document.getElementById('confirm-purchase-btn').onclick = async () => {
            const addr = {
                name: document.getElementById('ship-name').value,
                phone: document.getElementById('ship-phone').value,
                area: document.getElementById('ship-area').value,
                street: document.getElementById('ship-street').value,
                detail: document.getElementById('ship-detail').value,
                tag: currentTag
            };

            if(!addr.name || !addr.phone || !addr.street) return alert("Mohon lengkapi alamat pengiriman!");

            const userRef = ref(db, 'users/' + auth.currentUser.uid);
            const userSnap = await get(userRef);
            
            if(userSnap.val().balance < selectedItem.price) {
                alert("Saldo tidak cukup!");
                return closeAddressModal();
            }

            // PROSES TRANSAKSI
            const newBal = userSnap.val().balance - selectedItem.price;
            await update(userRef, { balance: newBal });

            // KIRIM DATA KE ADMIN (Via Chat System)
            const orderMsg = `[BARU] PESANAN: ${selectedItem.name}\nALAMAT: ${addr.street}, ${addr.area} (${addr.tag})\nPENERIMA: ${addr.name} (${addr.phone})`;
            
            await push(ref(db, `chats/${auth.currentUser.uid}/messages`), {
                sender: 'user',
                text: orderMsg,
                timestamp: serverTimestamp()
            });

            alert("Pesanan Berhasil! Alamat telah dikirim ke pusat.");
            closeAddressModal();
        };

        // ... Load items & auth logic tetap sama ...
    </script>
</body>
</html>
