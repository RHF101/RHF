<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | BLACK MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background: #050505; color: #eee; }
        .glass { background: rgba(15, 15, 15, 0.95); border: 1px solid rgba(255, 215, 0, 0.1); backdrop-filter: blur(10px); }
        .card-gold { border: 1px solid #222; transition: 0.3s; background: #0a0a0a; }
        .card-gold:hover { border-color: #FFD700; transform: translateY(-5px); }
        .btn-buy { background: linear-gradient(90deg, #b38728, #fcf6ba, #bf953f); color: #000; font-weight: 800; }
    </style>
</head>
<body class="pb-20">

    <nav class="sticky top-0 z-50 glass px-4 py-4 flex justify-between items-center border-b border-yellow-500/20">
        <div>
            <h1 class="text-xl font-bold text-yellow-500 tracking-tighter">RHF MARKET</h1>
            <p class="text-[8px] font-mono text-zinc-500">USER ID: <span id="user-display-id">---</span></p>
        </div>
        <div class="text-right">
            <p class="text-[10px] text-zinc-500 uppercase">Your Balance</p>
            <p id="user-balance" class="text-lg font-bold text-blue-400 font-mono">Rp 0</p>
        </div>
    </nav>

    <header class="p-4 mt-4">
        <div class="bg-gradient-to-r from-yellow-900/20 to-black p-6 rounded-3xl border border-yellow-500/10">
            <h2 class="text-2xl font-bold">Selamat Datang, Operative.</h2>
            <p class="text-xs text-zinc-400 mt-2">Semua transaksi dienkripsi dan anonim.</p>
        </div>
    </header>

    <main class="p-4">
        <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest mb-4">Available Assets</h3>
        
        <div id="market-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            <p class="text-zinc-600 animate-pulse text-xs">Menghubungkan ke server...</p>
        </div>
    </main>

    <div class="fixed bottom-0 w-full glass border-t border-white/5 p-4 flex justify-around items-center">
        <button class="text-yellow-500"><i class="fa-solid fa-house text-xl"></i></button>
        <button onclick="location.href='chat.html'" class="text-zinc-500"><i class="fa-solid fa-comment-dots text-xl"></i></button>
        <button onclick="handleLogout()" class="text-red-500"><i class="fa-solid fa-power-off text-xl"></i></button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 1. CEK AUTH & AMBIL DATA USER (SALDO)
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace("index.html");
            } else {
                document.getElementById('user-display-id').innerText = user.email;
                // Ambil Saldo Realtime
                onValue(ref(db, 'users/' + user.uid), (snap) => {
                    const data = snap.val();
                    if(data) {
                        document.getElementById('user-balance').innerText = "Rp " + (data.balance || 0).toLocaleString();
                    }
                });
            }
        });

        // 2. LOAD BARANG DARI DATABASE ADMIN
        onValue(ref(db, 'market_items'), (snap) => {
            const container = document.getElementById('market-container');
            container.innerHTML = '';
            
            if(!snap.exists()) {
                container.innerHTML = '<p class="text-zinc-600 text-xs text-center col-span-full">Belum ada barang jualan.</p>';
                return;
            }

            snap.forEach((child) => {
                const item = child.val();
                container.innerHTML += `
                <div class="card-gold p-4 rounded-2xl flex flex-col gap-3">
                    <img src="${item.img}" class="w-full h-40 object-cover rounded-xl bg-zinc-900 border border-white/5">
                    <div>
                        <span class="text-[8px] bg-yellow-600/20 text-yellow-500 px-2 py-0.5 rounded font-bold uppercase">${item.label}</span>
                        <h4 class="font-bold text-lg mt-1">${item.name}</h4>
                        <p class="text-xs text-zinc-500 h-8 overflow-hidden">${item.detail}</p>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <div>
                            <p class="text-[10px] text-zinc-500 uppercase">Price</p>
                            <p class="text-sm font-bold text-yellow-500">Rp ${item.price.toLocaleString()}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] text-zinc-500 uppercase">Stock</p>
                            <p class="text-xs font-bold ${item.stock > 0 ? 'text-green-500' : 'text-red-500'}">${item.stock}</p>
                        </div>
                    </div>
                    <button onclick="alert('Hubungi Admin untuk beli!')" class="btn-buy w-full py-2.5 rounded-xl text-xs uppercase mt-2 active:scale-95 transition">
                        Buy Asset
                    </button>
                </div>
                `;
            });
        });

        window.handleLogout = () => signOut(auth).then(() => location.href="index.html");
    </script>
</body>
</html>
