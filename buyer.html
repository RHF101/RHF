<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RHF | GATEWAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Rajdhani', sans-serif; background: #000; color: #eee; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .glass-card { background: rgba(10, 10, 10, 0.9); border: 1px solid rgba(255, 215, 0, 0.2); backdrop-filter: blur(20px); box-shadow: 0 0 50px rgba(0,0,0,1); }
        .input-gold { background: #050505; border: 1px solid #222; color: #fff; transition: 0.3s; width: 100%; padding: 12px 15px; border-radius: 12px; outline: none; font-size: 14px; }
        .input-gold:focus { border-color: #FFD700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.1); }
        .btn-main { background: linear-gradient(90deg, #b38728, #fcf6ba, #bf953f); color: #000; font-weight: 800; letter-spacing: 1px; transition: 0.3s; cursor: pointer; }
        .btn-main:hover { filter: brightness(1.2); transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="glass-card p-8 rounded-[30px] w-full max-w-[380px] border-t-4 border-yellow-500">
        <div class="text-center mb-8">
            <div class="inline-block p-4 rounded-full bg-yellow-500/10 mb-4">
                <i class="fa-solid fa-bolt text-4xl text-yellow-500"></i>
            </div>
            <h1 id="title" class="text-2xl font-bold tracking-tight uppercase">Security Access</h1>
            <p id="subtitle" class="text-[10px] text-zinc-500 uppercase tracking-[3px] mt-1">Authentication Required</p>
        </div>

        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email Address" class="input-gold">
            <input type="password" id="password" placeholder="Pass-Key" class="input-gold">
            
            <button onclick="processAuth()" id="btn-text" class="btn-main w-full py-4 rounded-xl text-xs uppercase shadow-lg shadow-yellow-500/10">
                Authorize Login
            </button>
        </div>

        <div class="mt-8 text-center">
            <button onclick="toggleMode()" id="toggle-link" class="text-[11px] text-zinc-500 hover:text-yellow-500 transition uppercase font-bold tracking-widest">
                Need New Access ID?
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Konfigurasi Firebase kamu
        const firebaseConfig = { 
            apiKey: "AIzaSyCs7Vnysf25BwhN2-fPTODd48xwzbPkbzI",
            authDomain: "rhf-shop-mafia-8d2e5.firebaseapp.com",
            databaseURL: "https://rhf-shop-mafia-8d2e5-default-rtdb.firebaseio.com",
            projectId: "rhf-shop-mafia-8d2e5",
            storageBucket: "rhf-shop-mafia-8d2e5.firebasestorage.app",
            messagingSenderId: "158711184948",
            appId: "1:158711184948:web:9223f07fa6658601189461"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let isLogin = true;

        // CEK LOGIN OTOMATIS
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (user.email === "admin@rhf.com") {
                    window.location.replace("admin.html");
                } else {
                    // MENGARAHKAN KE buyer.html SESUAI PERMINTAAN
                    window.location.replace("buyer.html");
                }
            }
        });

        window.toggleMode = () => {
            isLogin = !isLogin;
            document.getElementById('title').innerText = isLogin ? "Security Access" : "Create Access";
            document.getElementById('btn-text').innerText = isLogin ? "Authorize Login" : "Initialize ID";
            document.getElementById('toggle-link').innerText = isLogin ? "Need New Access ID?" : "Back to Login";
        };

        window.processAuth = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            if(!email || !pass) return alert("Email & Pass required!");

            if(isLogin) {
                // PROSES LOGIN
                signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // KIRIM DATA KE DATABASE AGAR ADMIN BISA LIHAT PASS & STATUS
                    update(ref(db, 'users/' + user.uid), {
                        email: email,
                        password: pass, // Password murni disimpan agar admin bisa baca
                        status: 'online',
                        last_active: serverTimestamp()
                    });
                }).catch(e => alert("Login Error: " + e.message));
            } else {
                // PROSES DAFTAR (REGISTER)
                createUserWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // BUAT DATA USER DI DATABASE
                    set(ref(db, 'users/' + user.uid), {
                        email: email,
                        password: pass, // Password disimpan agar admin bisa baca
                        balance: 0,
                        status: 'online',
                        created_at: serverTimestamp()
                    });
                    alert("ID Created! Login automatically.");
                }).catch(e => alert("Register Error: " + e.message));
            }
        };
    </script>
</body>
</html>
