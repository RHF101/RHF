<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RHF GAMS : CODE RPG - Text Adventure Elite</title>
  <link rel="stylesheet" href="style.css">
  <!-- PWA manifest untuk installable sebagai app -->
  <link rel="manifest" href="data:application/manifest+json,{
    'name': 'RHF GAMS CODE RPG',
    'short_name': 'CodeRPG',
    'start_url': '.',
    'display': 'standalone',
    'background_color': '#000',
    'theme_color': '#00ff41',
    'icons': [{'src': 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxjaXJjbGUgY3g9Ijk2IiBjeT0iOTYiIHI9Ijk2IiBmaWxsPSIjMDBmZjQxIi8+Cjx0ZXh0IHg9Ijk2IiB5PSIxMDYiIGZvbnQtZmFtaWx5PSJtb25vc3BhY2UiIGZvbnQtc2l6ZT0iNjQiIGZpbGw9IiMwMDAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5SPC90ZXh0Pgo8L3N2Zz4=', 'sizes': '192x192', 'type': 'image/svg+xml'}]
  }">
</head>
<body>
  <div class="matrix-bg" id="matrix"></div>

  <header>
    <h1>RHF GAMS : CODE RPG</h1>
    <p>Text-Based RPG | Bangun Empire Digital dari Nol</p>
  </header>

  <main>
    <!-- Status Panel -->
    <section class="panel status-panel">
      <h2>PLAYER STATUS</h2>
      <div id="player-stats"></div>
      <div class="area-info">
        <strong>Area Saat Ini:</strong> <span id="current-area">Training Server</span>
      </div>
    </section>

    <!-- Action Panel -->
    <section class="panel action-panel">
      <h2>AKSI</h2>
      <div class="buttons-grid">
        <button onclick="huntBug()">⚔️ Hunt Bug</button>
        <button onclick="openInventory()">🎒 Inventory</button>
        <button onclick="openShop()">🏪 Shop</button>
        <button onclick="changeArea()">🌍 Ganti Area</button>
        <button onclick="saveGame()">💾 Save</button>
        <button onclick="loadGame()">📂 Load</button>
        <button onclick="resetGame()">🗑️ Reset Game</button>
      </div>
    </section>

    <!-- Log & Combat Panel -->
    <section class="panel log-panel">
      <h2>LOG & COMBAT</h2>
      <div id="combat-log"></div>
      <div id="combat-actions" class="hidden">
        <button onclick="playerAction('attack')">Attack</button>
        <button onclick="playerAction('skill')">Fire Code (MP 10)</button>
        <button onclick="playerAction('potion')">Use Potion</button>
        <button onclick="playerAction('run')">Run</button>
      </div>
    </section>

    <!-- Inventory Modal -->
    <div id="inventory-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Inventory (Slots: <span id="inv-count">0/50</span>)</h2>
        <div id="inventory-list"></div>
        <button onclick="closeModal('inventory-modal')">Tutup</button>
      </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Shop</h2>
        <p>Gold kamu: <span id="shop-gold">0</span></p>
        <button onclick="buyItem('Potion', 50)">Potion (50 Gold) - Heal 30 HP</button>
        <button onclick="buyItem('Sword Shard', 150)">Sword Shard (150 Gold) - +5 ATK</button>
        <button onclick="closeModal('shop-modal')">Tutup</button>
      </div>
    </div>

    <!-- Class Selection (awal game) -->
    <div id="class-modal" class="modal">
      <div class="modal-content">
        <h2>Pilih Class Kamu</h2>
        <button onclick="selectClass('warrior')">Coder Warrior (ATK tinggi)</button>
        <button onclick="selectClass('mage')">Script Mage (MP besar)</button>
        <button onclick="selectClass('rogue')">Data Rogue (Luck & SPD)</button>
        <button onclick="selectClass('tank')">System Tank (DEF & HP)</button>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
  </html>
